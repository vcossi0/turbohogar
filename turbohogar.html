  // Debounce rawQuery → query (200ms)
  useEffect(()=>{
    const t=setTimeout(()=>{setQuery(rawQuery);setPage(1);},200);
    return ()=>clearTimeout(t);
  },[rawQuery]);

  // Reset page on filter changes
  useEffect(()=>{setPage(1);},[cat,orient]);

  const base = React.useMemo(()=>{
    const results = searchDesigns(query,{cat,orient});
    return results.length ? results : (query||orient ? [] : DESIGNS);
  },[query,cat,orient]);

  const totalPages = Math.max(1,Math.ceil(base.length/PER_PAGE));
  const curPage = Math.min(page,totalPages);
  const shown = base.slice((curPage-1)*PER_PAGE,curPage*PER_PAGE);
  // ventana de páginas: muestra hasta 5 alrededor de la actual
  const pageWindow=[];
  const winStart=Math.max(1,Math.min(curPage-2,totalPages-4));
  const winEnd=Math.min(totalPages,winStart+4);
  for(let p=winStart;p<=winEnd;p++) pageWindow.push(p);

  return <div className="page wrap" style={{paddingTop:96,paddingBottom:60,minHeight:'80vh'}}>
    <div style={{maxWidth:680,marginBottom:24}}>
      <p className="eyebrow" style={{marginBottom:10}}>Biblioteca</p>
      <h1 className="h1" style={{marginBottom:12}}>Biblioteca de diseños</h1>
      <p className="muted" style={{lineHeight:1.6}}>2.100+ diseños listos para personalizar en cuadros de DC Comics, Marvel, Funko, Juegos, Películas y Series TV.</p>
    </div>
    <div className="flex ic g3 card" style={{padding:'4px 8px 4px 20px',borderRadius:999,maxWidth:640,marginBottom:24,borderColor:'var(--line-2)'}}>
      <Icon n="search" s={20} c="var(--text-2)"/>
      <input className="input" style={{border:'none',background:'transparent',padding:'12px 0'}}
        placeholder="Buscar por tema, color, estilo o palabra clave..."
        value={rawQuery}
        onChange={e=>{setRawQuery(e.target.value);}}
        onKeyDown={e=>{if(e.key==='Escape'){setRawQuery('');setQuery('');}}}/>
      {rawQuery && <button className="icon-btn" onClick={()=>{setRawQuery('');setQuery('');}} title="Limpiar"><Icon n="x" s={16}/></button>}
      <button className="btn btn-primary btn-pill" style={{flex:'none'}} onClick={()=>setQuery(rawQuery)}>Buscar</button>
    </div>
    <div className="scroll-x" style={{marginBottom:12}}>
      {CATS.map(c=>(<button key={c} className={"chip"+(cat===c?" on":"")} onClick={()=>setCat(c)}>{c}</button>))}
    </div>
    <div className="flex ic g2" style={{marginBottom:20}}>
      <span className="small muted" style={{marginRight:4}}>Orientación:</span>
      {[['Todas',null],['Vertical','vertical'],['Horizontal','horizontal']].map(([label,val])=>(
        <button key={label} className={"chip"+(orient===val?" on":"")} style={{fontSize:12,padding:'4px 12px'}}
          onClick={()=>setOrient(val)}>{label}</button>
      ))}
      {base.length>0 && <span className="small muted" style={{marginLeft:'auto'}}>{base.length} diseño{base.length!==1?'s':''}</span>}
    </div>

    {loading ? <SkeletonGrid/> : shown.length>0 ? (
      <div className="masonry">
        {shown.map(d=>(<GalleryCard key={d.id} d={d} onQuick={setQuick}/>))}
      </div>
    ) : (
      <div style={{textAlign:'center',padding:'80px 24px',background:'linear-gradient(135deg, var(--bg), var(--surface))',borderRadius:12,minHeight:'300px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <video autoPlay loop muted playsInline
          style={{width:110,height:110,objectFit:'contain',display:'block',marginBottom:20,
            filter:'drop-shadow(0 8px 20px rgba(27,42,74,.3))'}}>
          <source src="assets/vigi.webm" type="video/webm"/>
          <img src="assets/vigi.gif" alt="Vlic"/>
        </video>
        <h3 style={{fontSize:20,fontWeight:900,color:'var(--accent)',marginBottom:10,letterSpacing:'-.01em'}}>{rawQuery?`Sin resultados para "${rawQuery}"`:'No hay diseños en esta categoría'}</h3>
        <p style={{fontSize:14,color:'var(--text)',lineHeight:1.6,maxWidth:280,marginBottom:24}}>Pero tienes 2.100+ opciones en otras categorías. ¿Exploramos juntos?</p>
        <button className="btn btn-primary" onClick={()=>{setCat('Todos');setRawQuery('');setQuery('');setOrient(null);}}><Icon n="grid" s={16}/>Ver todos los diseños</button>
      </div>
    )}

    {!loading && totalPages>1 && <div className="flex ic jc g2 fwrap" style={{marginTop:40}}>
      <button className="pg-btn" disabled={curPage<=1} onClick={()=>setPage(Math.max(1,curPage-1))}><Icon n="chevRight" s={16} style={{transform:'rotate(180deg)'}}/></button>
      {winStart>1 && <><button className={"pg-btn"+(curPage===1?" on":"")} onClick={()=>setPage(1)}>1</button><span className="muted" style={{padding:'0 4px'}}>…</span></>}
      {pageWindow.map(n=>(<button key={n} className={"pg-btn"+(curPage===n?" on":"")} onClick={()=>setPage(n)}>{n}</button>))}
      {winEnd<totalPages && <><span className="muted" style={{padding:'0 4px'}}>…</span><button className={"pg-btn"+(curPage===totalPages?" on":"")} onClick={()=>setPage(totalPages)}>{totalPages}</button></>}
      <button className="pg-btn" disabled={curPage>=totalPages} onClick={()=>setPage(Math.min(totalPages,curPage+1))}><Icon n="chevRight" s={16}/></button>
    </div>}

    {quick && <QuickView d={quick} onClose={()=>setQuick(null)}/>}
  </div>;
}

  useEffect(()=>{
    fetch(MOTOR_URL+'/health').then(r=>r.json()).then(()=>setMotorOk(true)).catch(()=>setMotorOk(false));

  const TIPOS = [
    {l:'🏞️ Paisaje', k:'paisaje', desc:'Montañas, océanos, naturaleza'},

  ];

    const tipoData = TIPOS.find(t=>t.k===tipo);
    const base = idea.trim() ? idea.trim() : (tipoData?.desc || 'hermosa escena');
    const tipoText = tipo ? 'de ' + tipoData.l.split(' ')[1].toLowerCase() : '';
    const estiloMap = {
      'Realista': 'fotorrealista, hiperdetallado, 8K, fotografía profesional',
      'Anime': 'estilo anime, cel shading, colores vibrantes, manga inspirado',
      'Digital Art': 'digital painting, concept art, artstation trending',

  const copiarPrompt = () => {

  const procesarConMotor = async (file) => {
    setFileName(file.name); setState('procesando'); setMockups([]);
    const fd = new FormData();
    fd.append('imagen', file);
    fd.append('orient', orient || 'vertical');
    try {
      const res  = await fetch(MOTOR_URL+'/procesar-upload', {method:'POST', body:fd});

        const urls = data.mockups.map(m=>({key:m.key, url:MOTOR_URL+m.url}));
        setMockups(urls); setState('listo');

      } else {
        setState('error');
      }
    } catch(e){
      setState('error');
    }
  };

  // Modo demo: subir sin procesar con Photoshop (motor offline)

    const url = URL.createObjectURL(file);

// Coordenadas del área del cuadro (normalizado 0-1) dentro del mockup.

function CompositePreview({imageSrc, orient, zoom=1, rot=0}){
  // Frame CSS que simula lienzo real — sin canvas 2D, sin problemas de CORS
  const isV = orient === 'vertical';
  const aspect = isV ? '3/4' : '4/3';
  const edgeSize = 18; // px — grosor del borde canvas lateral

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',gap:20,padding:'32px 24px'}}>

      {/* Marco canvas con perspectiva lateral */}
      <div style={{
        transform:`scale(${zoom}) rotate(${rot}deg)`,
        transition:'transform .25s var(--ease)',
        width: isV ? 280 : 400,
        maxWidth:'90%',
        position:'relative',
      }}>
        {/* Cara frontal — la imagen */}
        <div style={{
          aspectRatio: aspect,
          overflow:'hidden',
          borderRadius:3,
          boxShadow:`
            0 2px 0 rgba(0,0,0,.15),
            ${edgeSize}px ${edgeSize}px 0 rgba(0,0,0,.08),
            0 40px 80px rgba(0,0,0,.25),
            0 8px 24px rgba(0,0,0,.12)
          `,
          position:'relative',
          zIndex:2,
        }}>
          <img src={imageSrc} alt="Tu diseño"
            style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
          {/* Vignette sutil para dar profundidad */}
          <div style={{position:'absolute',inset:0,
            background:'radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.15) 100%)',
            pointerEvents:'none'}}/>
        </div>

        {/* Borde lateral derecho — simula grosor del canvas */}
        <div style={{
          position:'absolute',
          top: edgeSize, right: -edgeSize,
          bottom: -edgeSize,
          width: edgeSize,
          background:'linear-gradient(to right, rgba(0,0,0,.18), rgba(0,0,0,.08))',
          borderRadius:'0 3px 3px 0',
          zIndex:1,
          transformOrigin:'left center',
          skewY: '0deg',
        }}/>

        {/* Borde inferior — simula grosor del canvas */}
        <div style={{
          position:'absolute',
          bottom: -edgeSize, left: edgeSize,
          right: -edgeSize,
          height: edgeSize,
          background:'linear-gradient(to bottom, rgba(0,0,0,.22), rgba(0,0,0,.08))',
          borderRadius:'0 0 3px 0',
          zIndex:1,
        }}/>
      </div>

      {/* Info del tamaño */}
      <div style={{textAlign:'center'}}>
        <p style={{fontSize:13,color:'var(--text-2)',fontWeight:500,marginBottom:4}}>
          {isV ? '50×70 cm o 30×40 cm' : '70×50 cm o 40×30 cm'} · Lienzo premium
        </p>
        <p style={{fontSize:11,color:'var(--text-3)'}}>
          Vista previa aproximada · El producto final puede variar levemente
        </p>
      </div>
    </div>
  );
}

function MockupPreview({design, orient, zoom=1, rot=0, active=0}){
  const mockups = design && design.mock ? [
    design.mock.comun && {src: design.mock.comun, label:'Ambiente 1'},
    design.mock.a     && {src: design.mock.a,     label:'Ambiente 2'},
    design.mock.b     && {src: design.mock.b,     label:'Ambiente 3'},
  ].filter(Boolean) : [];

  if(!design){
    return (
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
        flexDirection:'column',gap:0,padding:'40px 24px',
        background:'linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%)'}}>
        <video autoPlay loop muted playsInline
          style={{width:130,height:130,objectFit:'contain',display:'block',marginBottom:16,
            filter:'drop-shadow(0 12px 32px rgba(27,42,74,.4))'}}>
          <source src="assets/vigi.webm" type="video/webm"/>
          <img src="assets/vigi.gif" alt="Vlic"/>
        </video>
      </div>
    );
  }

  const cur = mockups[active] || mockups[0];
  return (
    <div style={{
      position:'absolute', inset:0,
      display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center',
      gap:10, padding:'16px', overflow:'hidden',
      background:'#f0ede8', // fallback
    }}>

      {/* Ambient background — imagen difuminada que camufla el mockup */}
      <div style={{
        position:'absolute', inset:-40,
        backgroundImage:`url(${cur.src})`,
        backgroundSize:'cover',
        backgroundPosition:'center',
        filter:'blur(32px) saturate(1.2)',
        transform:'scale(1.15)',
        opacity:.55,
        zIndex:0,
        transition:'background-image .4s',
      }}/>
      {/* Overlay para suavizar los bordes */}
      <div style={{
        position:'absolute', inset:0, zIndex:1,
        background:'linear-gradient(to bottom, rgba(255,255,255,.18) 0%, rgba(255,255,255,.05) 50%, rgba(255,255,255,.18) 100%)',
      }}/>

      {/* Imagen — flota directamente sobre el ambient sin carta blanca */}
      <div style={{
        flex:1, minHeight:0, width:'100%', zIndex:2,
        display:'flex', alignItems:'center', justifyContent:'center',
        overflow:'hidden', background:'transparent',
      }}>
        <img
          src={cur.src}
          alt={design.name}
          loading="lazy"
          style={{
            maxWidth:'90%',
            maxHeight:'90%',
            width:'auto',
            height:'auto',
            objectFit:'contain',
            display:'block',
            borderRadius:8,
            boxShadow:'0 32px 80px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.3)',
            transform:`scale(${zoom}) rotate(${rot}deg)`,
            transition:'transform .25s var(--ease)',
          }}
        />
      </div>

      {/* Thumbnails pegados a la imagen, sin espacio muerto */}
      {/* thumbnails manejados desde el overlay del Editor */}
    </div>
  );
}

      product: variantLabel,
      design: designName,
      seed: d.seed || d.id || 'design',
      mockup: mockUrl,
      size,
      orient,
      variant: 'Impresión HD · Marco pino',
      price: sizePrice,
      qty: 1,
    };
  };
  const handleAddToCart = ()=>{
    const item = buildCartItem();
    if(!item) return;
    addToCart(item);
    setTimeout(()=>navigate('cart'),650);
  };

  const q = query.trim().toLowerCase();
  const list = DESIGNS.filter(d=>
    (cat==='Todos'||d.c===cat) &&
    (!q || (d.name&&d.name.toLowerCase().includes(q)) || (d.sub&&d.sub.toLowerCase().includes(q)))
  );
  const shown = list.slice(0,24);
  const selDesign = design && DESIGNS.find(d=>d.id===design.id);

  // Specs según el tamaño elegido
  const specPills = [['layout',size.replace('x','×')+' cm'],['layers','Lienzo premium'],['image','300 DPI'],['package','Marco pino']];

  const ctrl = [['zoomOut','Alejar',()=>setZoom(z=>Math.max(.6,+(z-.1).toFixed(2)))],['zoomIn','Acercar',()=>setZoom(z=>Math.min(1.6,+(z+.1).toFixed(2)))],
    ['reset','Resetear',()=>{setZoom(1);setRot(0);}],['rotate','Rotar',()=>setRot(r=>r+90)],['maximize','Pantalla completa',()=>{}]];

  return <div className="editor-shell" style={{display:'flex',flexDirection:'column',background:'var(--bg)',overflow:'hidden'}}>
    {/* editor header — parte del flujo, no sticky */}
    <div style={{flexShrink:0,zIndex:40,minHeight:64,background:'rgba(255,255,255,.95)',backdropFilter:'blur(16px)',
      borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',padding:'0 22px',gap:18}}>
      <button className="btn btn-ghost-line btn-sm" onClick={()=>navigate('gallery')}>
        <Icon n="arrowL" s={16}/>Volver</button>
      <div className="flex ic g3 fx jc hide-md" style={{minWidth:0}}>
        <div className="ed-step">
          <span className="ed-dot done"><Icon n="check" s={13} sw={3} c="#fff"/></span>
          <span className="ed-step-lbl act">Producto</span>
        </div>
        <span className="ed-conn act"/>
        <div className="ed-step">
          <span className={"ed-dot "+(ready?'done':'on')}>{ready?<Icon n="check" s={13} sw={3} c="#fff"/>:'2'}</span>
          <span className="ed-step-lbl act">Diseño</span>
        </div>
        <span className={"ed-conn"+(ready?' act':'')}/>
        <div className="ed-step">
          <span className="ed-dot">3</span>
          <span className="ed-step-lbl">Confirmar</span>
        </div>
      </div>
      <div className="flex ic g2" style={{marginLeft:'auto'}}>
        <button className="btn btn-ghost-line btn-sm hide-sm" onClick={()=>addToast('Borrador guardado ✏️')}>Guardar borrador</button>
        <button className={"btn btn-sm "+(ready?'btn-primary':'btn-disabled')} disabled={!ready}
          onClick={()=>ready&&handleAddToCart()}>Continuar<Icon n="arrowR" s={15}/></button>
      </div>
    </div>

    <div className="editor-split">
      {/* LEFT PANEL */}
      <div style={{background:'var(--surface)',borderRight:'1px solid var(--line)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* floating pill tabs */}
        <div style={{flex:'none',padding:'16px 18px 14px',display:'flex',justifyContent:'center'}}>
          <div className="ed-pills">
            {[['galeria','🖼','Galería'],['subir','⬆','Subir mi diseño'],['texto','✏','Texto']].map(([k,e,l])=>(
              <button key={k} className={"ed-pill"+(tab===k?' on':'')} onClick={()=>setTab(k)}>
                <span className="e">{e}</span>{l}</button>
            ))}
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'4px 18px 22px'}} ref={el=>el&&(el.scrollTop=0)}>
          {tab==='galeria' && <>

            {/* Vista inicial — sin búsqueda activa y sin categoría */}
            {cat==='Todos' && !query ? (
              <div>
                {/* Buscador */}
                <div className="ed-search" style={{marginBottom:20}}>
                  <span className="ic"><Icon n="search" s={16}/></span>
                  <input value={query} onChange={e=>setQuery(e.target.value)}
                    placeholder="Buscar diseño..."/>
                </div>

                {/* Diseño seleccionado (si hay) */}
                {selDesign && (
                  <div style={{marginBottom:16,padding:'10px 12px',borderRadius:10,
                    background:'var(--accent-soft)',border:'1.5px solid var(--accent)',
                    display:'flex',alignItems:'center',gap:10}}>
                    <img src={selDesign.mock?.comun} alt=""
                      style={{width:38,height:38,borderRadius:6,objectFit:'cover',flexShrink:0,
                        border:'1.5px solid rgba(27,42,74,.2)'}}/>
                    <div style={{minWidth:0,flex:1}}>
                      <p style={{fontSize:12,fontWeight:800,color:'var(--accent)',
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selDesign.name}</p>
                      <p style={{fontSize:11,color:'var(--text-3)',marginTop:1}}>{selDesign.cat}</p>
                    </div>
                    <Icon n="check" s={15} c="var(--accent)"/>
                  </div>
                )}

                {/* Título */}
                <p style={{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:12}}>
                  Elige tu universo
                </p>

                {/* Layout: 1 tile grande arriba + 2x2 abajo */}
                {(()=>{
                  const cats = CATS.filter(c=>c!=='Todos');
                  const featured = cats[0]; // DC COMICS — el más grande arriba
                  const rest = cats.slice(1); // los 5 restantes

                  const Tile = ({c, tall})=>{
                    const m = CAT_META[c]||{e:'🎨',l:c};
                    const rep = DESIGNS.find(d=>d.cat===c);
                    const count = DESIGNS.filter(d=>d.cat===c).length;
                    return (
                      <button onClick={()=>setCat(c)}
                        style={{position:'relative',width:'100%',
                          aspectRatio: tall ? '16/7' : '1',
                          borderRadius:12,overflow:'hidden',
                          padding:0,cursor:'pointer',border:'none',display:'block',
                          background:'#1a1a1a',
                          transition:'transform .25s, box-shadow .25s',}}
                        onMouseEnter={e=>{e.currentTarget.style.transform='scale(1.025)';e.currentTarget.style.boxShadow='0 12px 32px rgba(0,0,0,.2)';}}
                        onMouseLeave={e=>{e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow='none';}}>

                        {/* Fondo blur para panorámicos, cover para cuadrados */}
                        {rep && (tall ? <>
                          {/* Blur de fondo */}
                          <div style={{position:'absolute',inset:-20,
                            backgroundImage:`url(${rep.mock.comun})`,
                            backgroundSize:'cover',backgroundPosition:'center',
                            filter:'blur(18px) brightness(.5) saturate(.8)',
                            transform:'scale(1.1)'}}/>
                          {/* Imagen contenida a la derecha */}
                          <img src={rep.mock.comun} alt={m.l}

                              transform:'translateY(-50%)',
                              height:'115%',width:'auto',
                              objectFit:'contain',opacity:.9}}/>
                        </> : (
                          <img src={rep.mock.comun} alt={m.l}

                              objectFit:'cover',objectPosition:'center'}}/>

                        {/* Overlay de texto */}
                        <div style={{position:'absolute',inset:0,
                          background: tall
                            ? 'linear-gradient(to right,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 55%,transparent 80%)'
                            : 'linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.05) 60%)'

                        {/* Texto */}
                        <div style={{position:'absolute',inset:0,padding: tall?'16px 18px':'10px',
                          display:'flex',
                          flexDirection: tall?'row':'column',
                          alignItems: tall?'center':'flex-end',
                          justifyContent:'flex-start',
                          gap: tall?12:0,
                        }}>
                          {tall ? <>
                            <span style={{fontSize:26,lineHeight:1,flexShrink:0}}>{m.e}</span>
                            <div>
                              <p style={{fontSize:15,fontWeight:900,color:'#fff',
                                letterSpacing:'-.01em',marginBottom:3}}>{m.l}</p>
                              <p style={{fontSize:11,color:'rgba(255,255,255,.5)'}}>{count} diseños</p>
                            </div>
                          </> : <>
                            <span style={{fontSize:18,lineHeight:1,marginBottom:5,display:'block'}}>{m.e}</span>
                            <p style={{fontSize:11,fontWeight:800,color:'#fff',lineHeight:1.2}}>{m.l}</p>
                            <p style={{fontSize:10,color:'rgba(255,255,255,.45)',marginTop:2}}>{count}</p>
                          </>}
                        </div>
                      </button>
                    );
                  };

                  return <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {/* Tile grande */}
                    <Tile c={featured} tall={true}/>
                    {/* Grid 2x2 para los 4 siguientes */}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                      {rest.slice(0,4).map(c=><Tile key={c} c={c} tall={false}/>)}
                    </div>
                    {/* Último si hay más de 5 */}
                    {rest[4] && <Tile c={rest[4]} tall={true}/>}
                  </div>;
                })()}
              </div>

            ) : (
              /* Vista de categoría o búsqueda */
              <div>
                {/* Header de navegación */}
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                  <button onClick={()=>{setCat('Todos');setQuery('');}}
                    style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',
                      borderRadius:8,background:'var(--bg)',border:'1px solid var(--line)',
                      fontSize:12,fontWeight:600,color:'var(--text-2)',cursor:'pointer',
                      transition:'border-color .15s'}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                    onMouseLeave={e=>e.currentTarget.style.borderColor='var(--line)'}>
                    <Icon n="arrowL" s={13}/>Volver
                  </button>
                  {cat!=='Todos' && (
                    <div style={{display:'flex',alignItems:'center',gap:6,flex:1,minWidth:0}}>
                      <span style={{fontSize:16}}>{CAT_META[cat]?.e}</span>
                      <span style={{fontSize:13,fontWeight:700,color:'var(--text)',
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {CAT_META[cat]?.l||cat}
                      </span>
                    </div>
                  )}
                  {query && <span style={{fontSize:11,color:'var(--text-3)',flex:1}}>"{query}"</span>}
                  <span style={{fontSize:11,color:'var(--text-3)',flexShrink:0}}>{shown.length}</span>
                </div>

                {/* Buscador */}
                <div className="ed-search" style={{marginBottom:14}}>
                  <span className="ic"><Icon n="search" s={16}/></span>
                  <input value={query} onChange={e=>setQuery(e.target.value)}
                    placeholder={cat!=='Todos'?`Buscar en ${CAT_META[cat]?.l||cat}...`:'Buscar diseño...'}/>
                </div>

                {/* Grid 3 columnas */}
                {shown.length>0 ? (
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7}}>
                    {shown.map(d=>{
                      const on = design && design.id===d.id;
                      return (
                        <button key={d.id}
                          onClick={()=>{setDesign(d);setUploadedFile(null);setActiveMock(0);
                            setOrient(d.orient||orient);setSize((d.orient||orient)==='vertical'?'50x70':'70x50');}}
                          style={{position:'relative',aspectRatio:'1',borderRadius:8,overflow:'hidden',
                            padding:0,cursor:'pointer',
                            outline: on?'2.5px solid var(--accent)':'none',
                            outlineOffset:on?'2px':'0',
                            transition:'outline .15s, transform .2s',}}
                          onMouseEnter={e=>{if(!on)e.currentTarget.style.transform='scale(1.05)';}}
                          onMouseLeave={e=>e.currentTarget.style.transform='none'}>
                          <img src={(d.mock&&d.mock.comun)||IMG(d.seed,200,200)} alt={d.name}
                            loading="lazy" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                          {on && <span className="ed-check"><Icon n="check" s={11} sw={3} c="#fff"/></span>}
                        </button>
                      );
                    })}
                  </div>
                ) : (
                  <div style={{padding:'32px 0',textAlign:'center'}}>
                    <p style={{fontSize:13,color:'var(--text-3)'}}>Sin resultados para "{query}"</p>
                    <button onClick={()=>setQuery('')}
                      style={{marginTop:10,fontSize:12,color:'var(--accent)',background:'none',
                        border:'none',cursor:'pointer',fontWeight:600}}>Limpiar búsqueda</button>
                  </div>
                )}

                {/* Diseño seleccionado */}
                {selDesign && (
                  <div style={{marginTop:14,padding:'10px 12px',borderRadius:10,
                    background:'var(--accent-soft)',border:'1.5px solid var(--accent)',
                    display:'flex',alignItems:'center',gap:10}}>
                    <img src={selDesign.mock?.comun} alt=""
                      style={{width:34,height:34,borderRadius:6,objectFit:'cover',flexShrink:0}}/>
                    <div style={{minWidth:0,flex:1}}>
                      <p style={{fontSize:12,fontWeight:800,color:'var(--accent)',
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selDesign.name}</p>
                      <p style={{fontSize:11,color:'var(--text-3)'}}>{selDesign.cat}</p>
                    </div>
                    <Icon n="check" s={15} c="var(--accent)"/>
                  </div>
                )}
              </div>
            )}
          </>}
          {tab==='subir' && <UploadPanel productLabel={variantLabel} orient={orient}
            onValidated={(primaryUrl, allMockups)=>{
              // Construir diseño virtual con las URLs del motor
              const keys = allMockups || [{key:'comun', url:primaryUrl}];
              const mock = {};
              keys.forEach((m,i)=>{ mock[i===0?'comun':i===1?'a':'b'] = m.url; });
              setUploadedFile({
                id: 'upload_'+Date.now(),
                name: 'Tu diseño',
                n: 'Tu diseño',
                cat: 'Mi diseño',
                c: 'Mi diseño',
                orient,
                mock,
              });
              setDesign(null);
            }}/>}
          {tab==='texto' && <TextPanel/>}
        </div>
      </div>

      {/* RIGHT PANEL */}
      <div style={{background:'var(--bg)',display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>

        {/* Selector tamaño — orientación fijada por el diseño */}
        <div style={{flexShrink:0,padding:'12px 20px',borderBottom:'1px solid var(--line)',background:'var(--surface)'}}>
          <div style={{display:'flex',gap:16,alignItems:'flex-start'}}>
            {/* Orientación — solo informativa, fijada por el diseño */}
            <div style={{flex:'none'}}>
              <p style={{fontSize:10,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',
                color:'var(--text-3)',marginBottom:8}}>Orientación</p>
              <div style={{display:'inline-flex',alignItems:'center',gap:8,padding:'8px 14px',
                borderRadius:10,background:'var(--accent-soft)',border:'2px solid var(--accent)'}}>
                <span style={{
                  display:'inline-block',
                  width: orient==='vertical'?18:26,
                  height: orient==='vertical'?26:18,
                  border:'2.5px solid var(--accent)',borderRadius:3,
                }}/>
                <span style={{fontSize:12,fontWeight:700,color:'var(--accent)',textTransform:'capitalize'}}>{orient}</span>
              </div>
            </div>
            <div style={{width:1,background:'var(--line-2)',alignSelf:'stretch'}}/>
            {/* Tamaño */}
            <div style={{flex:1}}>
              <p style={{fontSize:10,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',
                color:'var(--text-3)',marginBottom:8}}>Tamaño</p>
              <div style={{display:'flex',gap:8}}>
                {sizeOptions.map(s=>(
                  <button key={s.v} onClick={()=>setSize(s.v)} className={"ed-size"+(size===s.v?' on':'')}>
                    <span className="num">{s.label.replace(' cm','')}</span>
                    <p className="pr">{CLP(s.price)}</p>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* MockupPreview + info overlay integrado */}
        <div style={{flex:1,minHeight:0,position:'relative',overflow:'hidden'}}>
          <MockupPreview design={activeDesign} orient={orient} zoom={zoom} rot={rot} active={activeMock}/>

          {/* Controles zoom — top right */}
          <div className="canvas-ctrl">
            {ctrl.map(([ic,label,fn])=>(
              <button key={label} className="cc-btn tip" onClick={fn}>
                <Icon n={ic} s={18}/><span className="tip-c">{label}</span>
              </button>
            ))}
          </div>

          {/* Info overlay — nombre elegante izquierda, precio+botón derecha */}
          <div style={{
            position:'absolute', bottom:0, left:0, right:0, zIndex:10,
            padding:'48px 24px 20px',
            background:'linear-gradient(to top, rgba(0,0,0,.52) 0%, rgba(0,0,0,.2) 60%, transparent 100%)',
            display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:16,
          }}>
            {/* Nombre elegante + selectores de mockup */}
            <div style={{minWidth:0,flex:1}}>
              {activeDesign && <>
                <p style={{fontSize:11,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',
                  color:'rgba(255,255,255,.6)',marginBottom:4}}>
                  {activeDesign.cat}
                </p>
                <p style={{fontSize:20,fontWeight:800,color:'#fff',lineHeight:1.2,
                  letterSpacing:'-.01em',marginBottom:12,
                  overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:260}}>
                  {activeDesign.name||activeDesign.n||'Tu diseño'}
                </p>
                {/* Selectores de ambiente */}
                {activeDesign.mock && (
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    {[activeDesign.mock.comun,activeDesign.mock.a,activeDesign.mock.b]
                      .filter(Boolean)
                      .map((src,i)=>(
                      <button key={i} onClick={()=>setActiveMock(i)}
                        style={{
                          width:44,height:44,borderRadius:8,overflow:'hidden',padding:0,cursor:'pointer',
                          border: activeMock===i?'2.5px solid #fff':'2.5px solid rgba(255,255,255,.25)',
                          opacity: activeMock===i?1:.6,
                          transition:'all .18s',
                          boxShadow: activeMock===i?'0 0 0 3px rgba(255,255,255,.2)':'none',
                          flexShrink:0,
                        }}>
                        <img src={src} alt={`Ambiente ${i+1}`}
                          style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                      </button>
                    ))}
                    <span style={{fontSize:11,color:'rgba(255,255,255,.45)',marginLeft:4}}>
                      Ambiente {activeMock+1}
                    </span>
                  </div>
                )}
              </>}
              {!activeDesign && (
                <p style={{fontSize:14,color:'rgba(255,255,255,.5)',fontStyle:'italic'}}>
                  Elige un diseño para continuar
                </p>
              )}
            </div>

            {/* Precio + botón derecha */}
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:10,flexShrink:0}}>
              {activeDesign && (
                <div style={{textAlign:'right'}}>
                  <p style={{fontSize:11,color:'rgba(255,255,255,.55)',marginBottom:2}}>Total</p>
                  <p style={{fontSize:26,fontWeight:900,color:'#fff',letterSpacing:'-.02em',lineHeight:1}}>
                    {CLP(sizePrice)}
                  </p>
                </div>
              )}
              <button
                disabled={!ready}
                onClick={()=>{if(ready) handleAddToCart();}}
                style={{
                  background: ready ? '#fff' : 'rgba(255,255,255,.2)',
                  color: ready ? 'var(--accent)' : 'rgba(255,255,255,.5)',
                  border:'none', padding:'12px 22px',
                  borderRadius:10, fontSize:14, fontWeight:800,
                  cursor: ready?'pointer':'not-allowed',
                  display:'flex', alignItems:'center', gap:8,
                  boxShadow: ready?'0 4px 20px rgba(0,0,0,.35)':'none',
                  transition:'transform .15s, box-shadow .15s',
                  whiteSpace:'nowrap',
                }}
                onMouseEnter={e=>{ if(ready){e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 8px 28px rgba(0,0,0,.4)'; }}}
                onMouseLeave={e=>{ e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow=ready?'0 4px 20px rgba(0,0,0,.35)':'none'; }}>
                <Icon n="cart" s={16}/>
                {ready ? 'Agregar al carrito' : 'Elige un diseño'}
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>;
}

/* ============================================================
   VIEW: CART
============================================================ */
function QtyCtrl({qty,onChange}){
  return <div className="flex ic" style={{border:'1px solid var(--line-2)',borderRadius:8,overflow:'hidden'}}>
    <button className="qty-b" onClick={()=>onChange(Math.max(1,qty-1))} disabled={qty<=1}><Icon n="minus" s={15}/></button>
    <span style={{minWidth:34,textAlign:'center',fontWeight:600,fontSize:14}}>{qty}</span>
    <button className="qty-b" onClick={()=>onChange(qty+1)}><Icon n="plus" s={15}/></button>
  </div>;
}
function Cart(){
  const {navigate,cartItems,updateCartQty,removeFromCart,addToast,discount:storeDiscount,setDiscount} = useStore();
  const [code,setCode]=useState('');
  const applied = storeDiscount && storeDiscount.code;
  const subtotal=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const discount=applied?storeDiscount.amount:0;
  const total=Math.max(0,subtotal-discount);
  const applyCode = ()=>{
    const c = code.trim().toUpperCase();
    if(!c) return;
    if(DISCOUNT_CODES[c]!==undefined){
      setDiscount({code:c, amount:DISCOUNT_CODES[c]});
      addToast('Código aplicado · −'+CLP(DISCOUNT_CODES[c]));
    } else {
      addToast('Código no válido','error');
    }
  };
  const freeAt=50000;
  const pct=Math.min(100,Math.round(subtotal/freeAt*100));

  if(!cartItems.length) return <div className="page wrap" style={{paddingTop:96,paddingBottom:80,minHeight:'70vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div className="tc" style={{maxWidth:480}}>
      <video autoPlay loop muted playsInline
        style={{width:100,height:100,objectFit:'contain',display:'block',margin:'0 auto 20px',
          filter:'drop-shadow(0 8px 20px rgba(27,42,74,.3))'}}>
        <source src="assets/vigi.webm" type="video/webm"/>
        <img src="assets/vigi.gif" alt="Vlic"/>
      </video>
      <h2 className="h2" style={{marginBottom:12,color:'var(--accent)'}}>Tu carrito está vacío</h2>
      <p className="muted" style={{marginBottom:10,lineHeight:1.6}}>Pero no te preocupes, tengo <strong style={{color:'var(--accent)',fontWeight:700}}>2.129 diseños increíbles</strong> esperando por ti.</p>
      <p className="small" style={{color:'var(--text-3)',marginBottom:28}}>✨ Elige uno del catálogo o sube tu propia foto</p>
      <button className="btn btn-primary btn-lg" onClick={()=>navigate('gallery')}><Icon n="grid" s={17}/>Explorar diseños</button>
    </div>
  </div>;

  return <div className="page wrap" style={{paddingTop:96,paddingBottom:70,minHeight:'70vh'}}>

// Validaciones básicas
const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||'').trim());
const isValidRut = r => {
  const clean = (r||'').replace(/[.\-\s]/g,'').toUpperCase();
  if(clean.length<2) return false;
  const body = clean.slice(0,-1), dv = clean.slice(-1);
  if(!/^\d+$/.test(body)) return false;
  let sum=0, mul=2;
  for(let i=body.length-1;i>=0;i--){ sum+=parseInt(body[i],10)*mul; mul=mul===7?2:mul+1; }
  const res=11-(sum%11);
  const calc=res===11?'0':res===10?'K':String(res);
  return calc===dv;
};
const isValidPhone = p => (p||'').replace(/[^\d]/g,'').length>=8;

function Checkout(){
  const {navigate,cartItems,discount,setCustomer,setLastOrder,clearCart,addToast} = useStore();
  const [ship,setShip]=useState('starken');
  const [region,setRegion]=useState('');
  const [f,setF]=useState({email:'',rut:'',nombre:'',apellido:'',dir:'',depto:'',ciudad:'',cp:'',tel:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const [errors,setErrors]=useState({});

  // Pago (Webpay mock)
  const [payOpen,setPayOpen]=useState(false);
  const [payStage,setPayStage]=useState('form'); // form|processing|success
  const [card,setCard]=useState({num:'',exp:'',cvv:'',name:''});
  const setC=(k,v)=>setCard(p=>({...p,[k]:v}));
  const [cardErr,setCardErr]=useState({});

  const subtotal=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const disc=discount?discount.amount:0;
  const shipCost=SHIP.find(s=>s.id===ship)?.p||0;
  const total=Math.max(0,subtotal+shipCost-disc);

  if(!cartItems.length) return <div className="page wrap" style={{paddingTop:110,paddingBottom:80,minHeight:'70vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div className="tc" style={{maxWidth:440}}>
      <h2 className="h2" style={{marginBottom:12}}>Tu carrito está vacío</h2>
      <p className="muted" style={{marginBottom:26}}>Agrega un diseño antes de continuar al checkout.</p>
      <button className="btn btn-primary btn-lg" onClick={()=>navigate('gallery')}><Icon n="grid" s={17}/>Explorar diseños</button>
    </div>
  </div>;

  // NOTA: se invoca como función pura {F({...})} y NO como componente <F/>.
  // Definir un componente dentro del render y usarlo como <F/> hace que React
  // lo trate como un tipo nuevo en cada keystroke → desmonta el <input/> y se
  // pierde el foco tras cada carácter. Llamarlo como función evita el remount.
  const F=({label,ph,type='text',span,k,req})=>(
    <div key={k} style={span?{gridColumn:'1 / -1'}:{}}>
      <label className="field-label">{label}{req && <span style={{color:'var(--error)'}}> *</span>}</label>
      <input className="input" type={type} placeholder={ph} value={f[k]||''}
        onChange={e=>set(k,e.target.value)}
        aria-label={label}
        style={errors[k]?{borderColor:'var(--error)'}:{}}/>
      {errors[k] && <p className="cap" style={{color:'var(--error)',marginTop:4}}>{errors[k]}</p>}
    </div>
  );

  const validate=()=>{
    const e={};
    if(!isValidEmail(f.email)) e.email='Email no válido';
    if(!isValidRut(f.rut)) e.rut='RUT no válido (ej: 12.345.678-5)';
    if(!f.nombre.trim()) e.nombre='Requerido';
    if(!f.apellido.trim()) e.apellido='Requerido';
    if(!f.dir.trim()) e.dir='Requerido';
    if(!f.ciudad.trim()) e.ciudad='Requerido';
    if(!region) e.region='Selecciona región';
    if(!isValidPhone(f.tel)) e.tel='Teléfono no válido';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const goToPay=()=>{
    if(!validate()){ addToast('Revisa los campos marcados','error'); return; }
    setCustomer({...f, region, ship});
    setPayStage('form'); setPayOpen(true);
  };

  // Webpay mock: validar presencia de datos de tarjeta, procesar, éxito
  const submitPayment=()=>{
    const ce={};
    if(card.num.replace(/\s/g,'').length<13) ce.num='Número incompleto';
    if(!/^\d{2}\/\d{2}$/.test(card.exp.trim())) ce.exp='MM/AA';
    if(card.cvv.replace(/\D/g,'').length<3) ce.cvv='CVV';
    if(!card.name.trim()) ce.name='Requerido';
    setCardErr(ce);
    if(Object.keys(ce).length) return;
    setPayStage('processing');
    setTimeout(()=>{
      setPayStage('success');
      setTimeout(()=>{
        // Registrar pedido confirmado y limpiar carrito
        const order={
          id:'TH-'+Math.floor(2848+Math.random()*900),
          items:cartItems,
          subtotal, discount:disc, discountCode:discount?discount.code:null,
          shipCost, shipName:SHIP.find(s=>s.id===ship)?.n||'Starken', total,
          customer:{...f,region,ship},
          fecha:new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}),
        };
        setLastOrder(order);
        // Persistir pedido para el panel de administración
        try {
          const prev=JSON.parse(localStorage.getItem('turbohogar_orders')||'[]');
          localStorage.setItem('turbohogar_orders', JSON.stringify([order,...prev].slice(0,50)));
        } catch(err){}
        clearCart();
        setPayOpen(false);
        navigate('confirm');
      },1100);
    },1900);
  };

  return <div className="page wrap" style={{paddingTop:96,paddingBottom:70,minHeight:'70vh'}}>
    <Breadcrumbs items={[{label:'Inicio',to:'home'},{label:'Carrito',to:'cart'},{label:'Checkout'}]}/>
    <div className="flex ic g2" style={{maxWidth:520,marginBottom:34}}>
      <span className="step on"><span className="num">1</span>Envío</span><span className="step-line act"/>
      <span className="step"><span className="num">2</span>Pago</span><span className="step-line"/>
      <span className="step"><span className="num">3</span>Listo</span>
    </div>
    <div className="cart-layout">
      <div className="flex col" style={{gap:28}}>
        <div className="card" style={{padding:24}}>
          <h3 className="h3" style={{marginBottom:18}}>Contacto</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {F({label:"Email",ph:"tu@email.com",type:"email",span:true,k:"email",req:true})}
            {F({label:"RUT",ph:"12.345.678-5",span:true,k:"rut",req:true})}
          </div>
        </div>
        <div className="card" style={{padding:24}}>
          <h3 className="h3" style={{marginBottom:18}}>Dirección de envío</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {F({label:"Nombre",ph:"Nombre",k:"nombre",req:true})}
            {F({label:"Apellido",ph:"Apellido",k:"apellido",req:true})}
            {F({label:"Dirección",ph:"Calle y número",span:true,k:"dir",req:true})}
            {F({label:"Departamento / casa (opcional)",ph:"Depto 402",span:true,k:"depto"})}
            {F({label:"Ciudad",ph:"Ciudad",k:"ciudad",req:true})}
            <div>
              <label className="field-label">Región</label>
              <Dropdown value={region} options={REGIONS} onChange={v=>{setRegion(v);setErrors(e=>({...e,region:undefined}));}} placeholder="Selecciona región" width={'100%'}/>
              {errors.region && <p className="cap" style={{color:'var(--error)',marginTop:4}}>{errors.region}</p>}
            </div>
            {F({label:"Código postal",ph:"7500000",k:"cp"})}
            {F({label:"Teléfono",ph:"+56 9 1234 5678",type:"tel",k:"tel",req:true})}
          </div>
        </div>
        <div className="card" style={{padding:24}}>
          <h3 className="h3" style={{marginBottom:18}}>Método de envío</h3>
          <div className="flex col g3">
            {SHIP.map(s=>(
              <div key={s.id} className={"radio-card"+(ship===s.id?' on':'')} onClick={()=>setShip(s.id)}>
                <span className="radio-dot"/>
                <div className="fx"><p style={{fontWeight:600}}>{s.n}</p><p className="cap muted">{s.d}</p></div>
                <span style={{fontWeight:700}}>{s.p?CLP(s.p):'Gratis'}</span>
              </div>
            ))}
          </div>
        </div>
        <button className="btn btn-primary btn-block btn-xl" onClick={goToPay}>Continuar al pago<Icon n="arrowR" s={18}/></button>
      </div>
      <CheckoutSummary ship={ship}/>
    </div>

    {payOpen && <PaymentModal
      stage={payStage} total={total} card={card} setC={setC} cardErr={cardErr}
      onClose={()=>setPayOpen(false)} onPay={submitPayment}/>}
  </div>;
}

        {stage==='processing' && <div className="tc" style={{padding:'30px 10px'}}>

function Sparkline({data,color='var(--accent)',w=88,h=30}){
  const max=Math.max(...data),min=Math.min(...data),rng=max-min||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-((v-min)/rng)*(h-4)-2]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return <svg width={w} height={h} style={{display:'block'}}>
    <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>;
}
function LineChartSVG({data,labels,height=240}){
  const [hi,setHi]=useState(null);
  const W=720,H=height,padL=44,padB=28,padT=14,padR=12;
  const max=Math.max(...data)*1.12, min=0, rng=max-min||1;
  const iw=W-padL-padR, ih=H-padT-padB;
  const X=i=>padL+(i/(data.length-1))*iw;
  const Y=v=>padT+ih-((v-min)/rng)*ih;
  const line=data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L ${X(data.length-1)} ${padT+ih} L ${X(0)} ${padT+ih} Z`;
  const ticks=4; const gy=Array.from({length:ticks+1},(_,i)=>min+(rng)*(i/ticks));
  return <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}} preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1B2A4A" stopOpacity=".18"/><stop offset="100%" stopColor="#1B2A4A" stopOpacity="0"/></linearGradient></defs>
    {gy.map((g,i)=>(<g key={i}>
      <line x1={padL} x2={W-padR} y1={Y(g)} y2={Y(g)} stroke="#E5E7EB" strokeWidth="1"/>
      <text x={padL-8} y={Y(g)+4} fill="#8B92A0" fontSize="11" textAnchor="end">{'$'+Math.round(g/1000)+'k'}</text>
    </g>))}
    <path d={area} fill="url(#lcg)"/>
    <path d={line} fill="none" stroke="#1B2A4A" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
    {data.map((v,i)=> (i%Math.ceil(data.length/8)===0||i===data.length-1)?
      <circle key={i} cx={X(i)} cy={Y(v)} r={hi===i?5:3} fill="#fff" stroke="#1B2A4A" strokeWidth="2"
        onMouseEnter={()=>setHi(i)} onMouseLeave={()=>setHi(null)} style={{cursor:'default'}}/>
    :null)}
    {hi!==null && data[hi]!==undefined && (() => {
      const tx=X(hi), ty=Y(data[hi]), tw=96, th=28, tx2=Math.min(tx,W-padR-tw), ty2=Math.max(ty-38,padT);
      return <g pointerEvents="none">
        <rect x={tx2} y={ty2} width={tw} height={th} rx="5" fill="#1B2A4A" opacity=".92"/>
        <text x={tx2+tw/2} y={ty2+18} fill="#fff" fontSize="12" textAnchor="middle" fontWeight="600">
          {'$'+(data[hi]/1000).toFixed(0)+'k'}
        </text>
      </g>;
    })()}
    {labels&&labels.map((l,i)=> (i%Math.ceil(labels.length/6)===0)?<text key={i} x={X(i)} y={H-8} fill="#8B92A0" fontSize="11" textAnchor="middle">{l}</text>:null)}
  </svg>;
}
function BarChartSVG({data,labels,colors,height=240}){
  const W=720,H=height,padL=44,padB=28,padT=14,padR=12;
  const max=Math.max(...data)*1.12||1; const iw=W-padL-padR, ih=H-padT-padB;
  const bw=iw/data.length*0.55, gap=iw/data.length;
  const Y=v=>padT+ih-(v/max)*ih;
  const ticks=4; const gy=Array.from({length:ticks+1},(_,i)=>max*(i/ticks));
  return <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}} preserveAspectRatio="xMidYMid meet">
    {gy.map((g,i)=>(<g key={i}><line x1={padL} x2={W-padR} y1={Y(g)} y2={Y(g)} stroke="#E5E7EB" strokeWidth="1"/>
      <text x={padL-8} y={Y(g)+4} fill="#8B92A0" fontSize="11" textAnchor="end">{Math.round(g)}</text></g>))}
    {data.map((v,i)=>{ const x=padL+gap*i+(gap-bw)/2; const y=Y(v);
      return <g key={i}>
        <rect x={x} y={y} width={bw} height={padT+ih-y} rx="5" fill={(colors&&colors[i])||'#1B2A4A'} opacity=".88"/>
        {labels&&<text x={x+bw/2} y={H-8} fill="#8B92A0" fontSize="11" textAnchor="middle">{labels[i]}</text>}
      </g>;
    })}
  </svg>;
}
function DonutSVG({data,size=180,thickness=26}){
  const total=data.reduce((s,d)=>s+d.v,0)||1; const r=(size-thickness)/2; const C=2*Math.PI*r; let acc=0;
  return <div className="flex ic g4 fwrap">
    <svg width={size} height={size} style={{flex:'none'}}>
      <g transform={`translate(${size/2},${size/2}) rotate(-90)`}>
        <circle r={r} fill="none" stroke="#EEF0F2" strokeWidth={thickness}/>
        {data.map((d,i)=>{ const len=d.v/total*C; const el=<circle key={i} r={r} fill="none" stroke={d.c} strokeWidth={thickness}
          strokeDasharray={`${len} ${C-len}`} strokeDashoffset={-acc} strokeLinecap="butt"/>; acc+=len; return el; })}
      </g>
      <text x={size/2} y={size/2-4} fill="#111111" fontSize="22" fontWeight="800" textAnchor="middle">{total}</text>
      <text x={size/2} y={size/2+16} fill="#8B92A0" fontSize="11" textAnchor="middle">total</text>
    </svg>
    <div className="flex col g3">
      {data.map((d,i)=>(<div key={i} className="flex ic g2 small">
        <span style={{width:10,height:10,borderRadius:3,background:d.c,flex:'none'}}/>
        <span style={{fontWeight:600,color:'#4A5568'}}>{d.n}</span><span style={{color:'#8B92A0'}}>· {Math.round(d.v/total*100)}%</span></div>))}
    </div>
  </div>;
}

function AdminUpload({cats}){
  const {addToast}=useStore();

  const pickFolder=()=>{
    setFiles(SAMPLE_FILES.map(f=>({...f,p:0}))); setProg(0);
    let p=0; const t=setInterval(()=>{ p+=6+Math.random()*8; if(p>=100){p=100;clearInterval(t);} setProg(Math.round(p));
      setFiles(fs=>fs.map(f=>({...f,p:Math.min(100,Math.round(p+Math.random()*10))}))); },180);
  };
  const ok=files.filter(f=>f.st==='ok').length, warn=files.filter(f=>f.st==='warn').length, err=files.filter(f=>f.st==='err').length;
  const done=prog>=100;
  const stMap={ok:{c:'var(--success)',l:'Óptima',ic:'check'},warn:{c:'var(--warning)',l:'Baja resolución',ic:'refresh'},err:{c:'var(--error)',l:'Formato inválido',ic:'x'}};

      onDragOver={e=>{e.preventDefault();setDropping(true);}} onDragLeave={()=>setDropping(false)}

      <div className="float" style={{width:66,height:66,borderRadius:18,margin:'0 auto 16px',display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(201,162,75,.12)',color:'var(--accent)'}}><Icon n="upload" s={30}/></div>
      <p style={{fontWeight:700,fontSize:17,marginBottom:6}}>{dropping?'Suelta la carpeta aquí':'Arrastra una carpeta completa'}</p>
      <p className="small muted" style={{marginBottom:18}}>Sube cientos de diseños de una vez. Validamos formato, resolución y proporción automáticamente.</p>
      <button className="btn btn-outline" onClick={pickFolder}><Icon n="layers" s={16}/>Seleccionar carpeta</button>
    </div>

    {files.length>0 && <>
      <div className="card" style={{padding:'16px 20px'}}>
        <div className="flex ic jb" style={{marginBottom:done?0:12}}>
          <span className="small" style={{fontWeight:600}}>{done?'Análisis completo':'Subiendo y analizando…'} · {files.length} archivos</span>
          <span className="cap muted">{prog}%</span>
        </div>
        {!done && <div className="prog-bar"><div className="prog-fill" style={{width:prog+'%'}}/></div>}
        {done && <div className="flex g3 fwrap" style={{marginTop:8}}>
          <span className="pill pill-success">{ok} óptimas</span>
          <span className="pill pill-warn">{warn} con advertencia</span>
          <span className="pill pill-error">{err} con error</span>
        </div>}
      </div>

      <div className="card" style={{padding:0,overflow:'hidden'}}>
        {files.map((f,i)=>{ const s=stMap[f.st];
          return <div key={i} className="flex ic g3" style={{padding:'12px 16px',borderBottom:i<files.length-1?'1px solid var(--line)':'none'}}>
            <div style={{width:40,height:40,borderRadius:8,flex:'none',background:'var(--elevated)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-3)'}}><Icon n="image" s={18}/></div>
            <div className="fx" style={{minWidth:0}}>
              <p className="small" style={{fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{f.n}</p>
              <p className="cap muted">{f.res} · {f.size}</p>
              {f.p<100 && <div className="prog-bar" style={{marginTop:6,maxWidth:200}}><div className="prog-fill" style={{width:f.p+'%'}}/></div>}
            </div>
            {f.p>=100 && <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,fontWeight:600,color:s.c}}><Icon n={s.ic} s={14}/>{s.l}</span>}
          </div>;
        })}
      </div>

      {done && <div className="card flex ic jb fwrap g3" style={{padding:'16px 20px'}}>
        <div className="flex ic g3" style={{flex:1,minWidth:220}}>
          <span className="small muted nowrap">Asignar a:</span>
          <Dropdown value={cat} options={cats.map(c=>c.n)} onChange={setCat} placeholder="Selecciona categoría" width={200}/>
        </div>
        <button className="btn btn-primary" onClick={()=>addToast(`${ok+warn} diseños publicados 🎨`)} disabled={!cat}>
          <Icon n="check" s={17}/>Publicar {ok+warn} diseños</button>
      </div>}
    </>}
  </div>;
}
