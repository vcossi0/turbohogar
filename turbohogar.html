<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TurboHogar — Productos personalizados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TURBOHOGAR — DESIGN SYSTEM
============================================================ */
:root{
  /* TurboHogar — Light premium system (approved brand identity) */
  --bg:#FAFAF8;            /* warm white — main background */
  --surface:#F0EDE8;       /* cream — cards & surfaces */
  --surface-2:#E8E4DE;     /* darker cream */
  --text:#111111;          /* soft black */
  --text-2:#555555;        /* mid grey */
  --text-3:#999999;        /* light grey */
  --accent:#1B2A4A;        /* deep navy — buttons, CTAs, highlights */
  --accent-2:#243660;      /* navy highlight (was gold accent-2) */
  --accent-hover:#243660;
  --accent-soft:rgba(27,42,74,.08);
  --success:#2D7A4F;
  --error:#C0392B;
  --warning:#B7791F;
  --line:rgba(17,17,17,.08);
  --line-2:rgba(17,17,17,.14);
  --line-hover:rgba(27,42,74,.3);
  --elevated:var(--surface-2);
  --r-card:14px; --r-btn:10px; --r-modal:18px; --r-pill:999px;
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.12);
  --grad:linear-gradient(135deg,#1B2A4A,#243660);
  --serif:'Inter',-apple-system,sans-serif;
  --maxw:1280px; --head-h:64px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
::selection{background:rgba(27,42,74,.18);color:var(--text)}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  overflow-x:hidden;
}
#root{min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:var(--line-hover)}

/* ---------- layout utils ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{padding:0 24px}}
@media(min-width:1024px){.wrap{padding:0 48px}}
.flex{display:flex}.col{flex-direction:column}.wrapf{flex-wrap:wrap}
.ic{align-items:center}.is{align-items:flex-start}.ie{align-items:flex-end}
.jc{justify-content:center}.jb{justify-content:space-between}.je{justify-content:flex-end}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g5{gap:20px}.g6{gap:24px}.g7{gap:28px}.g8{gap:32px}.g10{gap:40px}.g12{gap:48px}.g14{gap:56px}.g16{gap:64px}
.grid{display:grid}
.full{width:100%}.hfull{height:100%}.tc{text-align:center}.tr{text-align:right}
.rel{position:relative}.abs{position:absolute}.fx{flex:1}.fwrap{flex-wrap:wrap}
.pointer{cursor:pointer}.nowrap{white-space:nowrap}.hidden{display:none}
.muted{color:var(--text-2)}.muted3{color:var(--text-3)}.accent{color:var(--accent)}
.mono{font-family:'Roboto Mono',monospace}
.sect{padding:80px 0}
@media(max-width:768px){.sect{padding:52px 0}}

/* ---------- typography ---------- */
/* Editorial serif headlines (Fraunces) over Inter body for art-gallery contrast */
.hero-t{font-family:var(--serif);font-size:68px;font-weight:500;letter-spacing:-.02em;line-height:1.02}
.h1{font-family:var(--serif);font-size:50px;font-weight:500;letter-spacing:-.015em;line-height:1.06}
.h2{font-family:var(--serif);font-size:36px;font-weight:500;letter-spacing:-.01em;line-height:1.12}
.h3{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.005em}
.serif{font-family:var(--serif)}
.body{font-size:16px}.small{font-size:14px}.cap{font-size:12px}
@media(max-width:768px){
  .hero-t{font-size:42px}.h1{font-size:34px}.h2{font-size:28px}.h3{font-size:21px}
}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.a-t11{font-size:11px}.a-t12{font-size:12px}.a-t13{font-size:13px}
.a-t14{font-size:14px}.a-t16{font-size:16px}.a-t18{font-size:18px}
.a-t20{font-size:20px}.a-t24{font-size:24px}.a-t28{font-size:28px}
.a-t32{font-size:32px}.a-t36{font-size:36px}
.a-num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:14px;border-radius:var(--r-btn);
  padding:11px 20px;transition:all .2s ease-out;white-space:nowrap;line-height:1;
  border:1px solid transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 6px 22px rgba(27,42,74,.22)}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 10px 30px rgba(27,42,74,.30)}
.btn-pill{border-radius:var(--r-pill)}
.btn-outline{border:1.5px solid var(--line-2);color:var(--text);background:transparent}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost-line{border:1.5px solid var(--accent);color:var(--accent);background:transparent}
.btn-ghost-line:hover{background:var(--accent-soft)}
.btn-lg{padding:16px 32px;font-size:15px}
.btn-xl{padding:18px 40px;font-size:16px}
.btn-sm{padding:8px 14px;font-size:13px}
.qty-b{width:34px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s,color .15s}
.qty-b:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.qty-b:disabled{opacity:.4;cursor:not-allowed}
.btn-block{width:100%}
.btn-disabled{opacity:.55;pointer-events:none;background:var(--surface-2) !important;color:var(--text-3) !important;box-shadow:none !important}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:var(--r-pill);line-height:1;border:1px solid transparent}
.pill-accent{background:var(--accent);color:#fff;font-weight:700}
.pill-success{background:rgba(45,122,79,.12);color:var(--success);border-color:rgba(45,122,79,.3)}
.pill-error{background:rgba(192,57,43,.12);color:var(--error);border-color:rgba(192,57,43,.3)}
.pill-warn{background:rgba(183,121,31,.12);color:var(--warning);border-color:rgba(183,121,31,.3)}
.pill-muted{background:var(--surface-2);color:var(--text-2);border-color:var(--line-2)}
.pill-solid-green{background:var(--success);color:#fff}
.pill-glass{background:rgba(27,42,74,.08);color:var(--accent);border:1px solid rgba(27,42,74,.15)}
.pill-spec{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-2);
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:500}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.card-h{transition:transform .2s ease-out,border-color .2s,box-shadow .2s}
.card-h:hover{transform:translateY(-4px);border-color:var(--line-hover);box-shadow:var(--shadow)}
.surface-2{background:var(--surface-2)}

/* ---------- inputs ---------- */
.field-label{font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:7px;display:block}
.input,.textarea,.select{
  width:100%;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-btn);padding:12px 16px;color:var(--text);font-size:14px;
  transition:border-color .2s,box-shadow .2s;outline:none}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,42,74,.15)}
.textarea{resize:vertical;min-height:110px;line-height:1.6}
.select{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%23A0A0A0' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}

/* custom checkbox */
.cbx{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--text-2);user-select:none}
.cbx .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-hover);
  display:flex;align-items:center;justify-content:center;flex:none;transition:all .15s}
.cbx.on .box{background:var(--accent);border-color:var(--accent)}
.cbx.on{color:var(--text)}
.cbx .box svg{opacity:0;transition:opacity .15s}
.cbx.on .box svg{opacity:1}

/* switch */
.switch{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;
  transition:background .2s;flex:none;cursor:pointer}
.switch.on{background:var(--accent)}
.switch .thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch.on .thumb{transform:translateX(18px)}

/* range slider */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:999px;
  background:var(--line-2);outline:none;cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer;border:2px solid var(--accent)}
.rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;
  border:2px solid var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}

/* segmented buttons (variant selector) */
.seg{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-btn);padding:4px;gap:4px}
.seg button{flex:1;padding:10px 12px;border-radius:6px;font-size:14px;font-weight:600;
  color:var(--text-2);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(27,42,74,.25)}

/* radio card */
.radio-card{display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-btn);padding:16px;cursor:pointer;transition:all .18s}
.radio-card:hover{border-color:var(--line-hover)}
.radio-card.on{border-color:var(--accent);background:var(--accent-soft)}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-hover);flex:none;
  display:flex;align-items:center;justify-content:center;transition:border-color .18s}
.radio-card.on .radio-dot{border-color:var(--accent)}
.radio-card.on .radio-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* ---------- header ---------- */
.header{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--head-h);
  background:rgba(250,250,248,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);transition:all .3s var(--ease)}
.header.scrolled{height:56px;box-shadow:0 6px 24px rgba(0,0,0,.06);background:rgba(250,250,248,.95)}
.header .wrap{height:100%}
.logo{font-family:'Inter',-apple-system,sans-serif;font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.logo .o{color:var(--accent)}
.nav-link{font-size:14px;font-weight:500;color:var(--text-2);transition:color .18s;position:relative;padding:6px 0}
.nav-link:hover{color:var(--text)}
.nav-link.on{color:var(--text)}
.nav-link.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent);border-radius:2px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:all .18s;position:relative}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.badge{position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;border:1px solid var(--accent)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;backdrop-filter:blur(2px);
  animation:fade .2s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:280px;background:var(--bg);z-index:210;
  border-left:1px solid var(--line);padding:24px;animation:slideR .3s var(--ease);overflow-y:auto}
.drawer-link{display:block;padding:15px 0;font-size:17px;font-weight:500;color:var(--text);border-bottom:1px solid var(--line)}
.drawer-link:hover{color:var(--accent)}

/* ---------- modal ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-modal);
  box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto;animation:pop .3s var(--ease)}
.modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;z-index:5;transition:background .18s}
.modal-close:hover{background:rgba(0,0,0,.8)}

/* ---------- dropdown ---------- */
.dropdown{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-btn);
  box-shadow:var(--shadow);overflow:hidden;animation:pop .15s var(--ease);min-width:180px}
.dd-item{padding:11px 16px;font-size:14px;color:var(--text);cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dd-item:hover{background:var(--accent-soft)}
.dd-item.on{color:var(--accent)}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:12px}
.toast{background:var(--surface);border:1px solid var(--line-2);border-left:4px solid var(--accent);
  border-radius:var(--r-btn);padding:14px 16px;box-shadow:var(--shadow-lg);min-width:300px;max-width:380px;
  display:flex;align-items:center;gap:12px;animation:slideR .3s var(--ease)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--error)}
@media(max-width:520px){.toast-wrap{left:16px;right:16px;bottom:16px}.toast{min-width:0;max-width:none}}

/* ---------- skeleton ---------- */
.skel{background:var(--surface);border-radius:var(--r-card);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shimmer 1.4s infinite}

/* ---------- tooltip ---------- */
.tip{position:relative}
.tip .tip-c{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--surface-2);color:var(--text);font-size:12px;padding:6px 10px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;border:1px solid var(--line-2);box-shadow:var(--shadow)}
.tip:hover .tip-c{opacity:1}

/* ---------- spinner ---------- */
.spin{width:24px;height:24px;border:2.5px solid rgba(27,42,74,.2);border-top-color:var(--accent);
  border-radius:50%;animation:rot .7s linear infinite}
.spin-sm{width:16px;height:16px;border-width:2px}

/* ---------- accordion ---------- */
.acc-item{border-bottom:1px solid var(--line)}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:18px 0;cursor:pointer;font-weight:600;font-size:15px;gap:12px}
.acc-head .chev{transition:transform .25s var(--ease);color:var(--text-2);flex:none}
.acc-item.open .acc-head .chev{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s var(--ease),padding .35s var(--ease)}
.acc-item.open .acc-body{max-height:320px;padding-bottom:18px}
.acc-body p{color:var(--text-2);font-size:14px;line-height:1.7}

/* ---------- product / design tiles ---------- */
.tile{position:relative;overflow:hidden;border-radius:var(--r-card);background:var(--surface);
  border:1px solid var(--line);transition:border-color .25s,transform .25s,box-shadow .25s}
.tile:hover{border-color:var(--line-hover);box-shadow:0 16px 40px rgba(0,0,0,.10),0 0 0 1px rgba(27,42,74,.18)}
.tile-img{overflow:hidden;position:relative}
.tile-img img{width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease)}
.tile:hover .tile-img img{transform:scale(1.05)}
.tile-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,16,0) 35%,rgba(11,12,16,.55) 60%,rgba(11,12,16,.94));
  opacity:0;transition:opacity .3s;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.tile:hover .tile-ov{opacity:1}
.tile-name{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.01em;
  transform:translateY(8px);transition:transform .3s var(--ease)}
.tile:hover .tile-name{transform:translateY(0)}
.heart{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(17,19,26,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  color:#fff;z-index:3;transition:all .2s;border:1px solid rgba(255,255,255,.15)}
.heart:hover{background:rgba(17,19,26,.9);transform:scale(1.1)}
.heart.on{color:var(--error)}

/* ---------- responsive grids ---------- */
.gc2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.gc3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.gc4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.gc5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:1024px){.gc4{grid-template-columns:repeat(3,1fr)}.gc5{grid-template-columns:repeat(3,1fr)}.gc3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.gc2,.gc3,.gc4,.gc5{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:430px){.gc2,.gc3{grid-template-columns:1fr}}
/* ────── MOBILE FIRST: 320-480px ────── */
@media(max-width:480px){
  :root{--maxw:480px;--head-h:56px}
  .wrap{padding:0 12px}
  .sect{padding:40px 0}
  .btn{padding:12px 20px;font-size:14px}
  .btn-lg{padding:14px 24px;font-size:15px;min-height:48px}
  .h1{font-size:28px;line-height:1.2}
  .h2{font-size:22px}
  .h3{font-size:18px}
  .card{padding:12px;border-radius:10px}
  /* hero responsive */
  .hero-copy{padding:80px 16px 60px}
  .hero-eyebrow{margin-bottom:16px}
  .hero-h{font-size:clamp(28px,7vw,36px);margin-bottom:16px}
  .hero-sub{font-size:14px;margin-bottom:24px}
  .hero-trust{flex-direction:column;gap:16px;margin-top:24px;padding-top:16px}
  /* modals & panels */
  .modal{max-width:calc(100% - 16px);border-radius:14px}
  .drawer{width:100% !important}
  /* forms */
  input,textarea,select{font-size:16px;padding:10px 12px;border-radius:8px}
  /* buttons larger for touch */
  button[type="button"]{min-height:44px}
  .icon-btn{width:40px;height:40px}
  /* padding reductions */
  .page{padding-top:16px;padding-bottom:16px}
  /* images in grid */
  .gc2,.gc3{grid-template-columns:1fr}
  /* scrollable sections */
  .scroll-horiz{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
  /* footer */
  footer{padding:32px 12px}
}

/* ============================================================
   PRODUCT MOCKUPS (canvas frame / mug / mousepad)
============================================================ */
/* wall + framed canvas */
.wall{background:
  radial-gradient(120% 90% at 50% 0%,#2a2e3a 0%,#1b1e27 55%,#15171f 100%);
  position:relative;display:flex;align-items:center;justify-content:center;border-radius:var(--r-card);overflow:hidden}
.wall::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 30%);}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));} /* floor shadow hint */
.frame{position:relative;background:linear-gradient(135deg,#5a4632,#3a2c1e);
  padding:14px;border-radius:4px;box-shadow:0 24px 50px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.08) inset;z-index:2}
.frame .matte{background:#0d0d0d;padding:0;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6) inset}
.frame .art{width:100%;height:100%;object-fit:cover;display:block}
.dim-line{position:absolute;color:var(--text-3);font-size:11px;font-weight:500;display:flex;align-items:center;gap:6px}
.dim-h{bottom:-26px;left:0;right:0;justify-content:center}
.dim-v{top:0;bottom:0;right:-30px;flex-direction:column;justify-content:center}

/* mug */
.mug-stage{display:flex;align-items:center;justify-content:center;perspective:900px}
.mug{position:relative;transform:rotateY(-14deg);transform-style:preserve-3d}
.mug-body{width:170px;height:200px;border-radius:14px 14px 18px 18px;position:relative;overflow:hidden;
  background:#f4f4f4;box-shadow:0 30px 50px rgba(0,0,0,.55), inset -22px 0 36px rgba(0,0,0,.28), inset 22px 0 30px rgba(255,255,255,.5)}
.mug-print{position:absolute;inset:0;background-size:cover;background-position:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);
  filter:saturate(1.02)}
.mug-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.32),transparent 30%,transparent 70%,rgba(0,0,0,.22))}
.mug-top{position:absolute;top:-9px;left:0;right:0;height:18px;border-radius:50%;
  background:#e4e4e4;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25)}
.mug-handle{position:absolute;right:-44px;top:50px;width:54px;height:84px;
  border:16px solid #ededed;border-radius:50%;border-left-color:transparent;border-bottom-color:transparent;
  transform:rotate(18deg);box-shadow:6px 4px 14px rgba(0,0,0,.4)}

/* mousepad */
.pad-stage{display:flex;align-items:center;justify-content:center;perspective:1100px;
  background:radial-gradient(120% 100% at 50% 30%,#2a211a,#171210);border-radius:var(--r-card)}
.pad{transform:rotateX(46deg) rotateZ(-22deg);transform-style:preserve-3d;
  box-shadow:0 50px 60px rgba(0,0,0,.6)}
.pad-surface{width:300px;height:200px;border-radius:12px;overflow:hidden;position:relative;
  background:#1a1a1a;border:2px solid #0a0a0a}
.pad-surface img{width:100%;height:100%;object-fit:cover}
.pad-surface::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 50%)}

/* canvas float controls */
.canvas-ctrl{position:absolute;top:14px;right:14px;transform:none;
  background:rgba(26,26,26,.82);backdrop-filter:blur(10px);border:1px solid var(--line-2);
  border-radius:999px;padding:7px 10px;display:flex;align-items:center;gap:4px;z-index:6;box-shadow:var(--shadow)}
.cc-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.85);transition:all .15s}
.cc-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.cc-div{width:1px;height:20px;background:var(--line-2);margin:0 2px}

/* dropzone */
.dropzone{border:2px dashed var(--line-hover);border-radius:var(--r-modal);background:var(--bg);
  padding:40px 24px;text-align:center;transition:all .2s;cursor:pointer}
.dropzone:hover{border-color:var(--accent)}
.dropzone.drag{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.req-line{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text-2);text-align:left}
.val-banner{border-radius:var(--r-btn);padding:14px 16px;font-size:13.5px}
.val-success{background:rgba(34,197,94,.10);border:1px solid var(--success)}
.val-warn{background:rgba(245,158,11,.10);border:1px solid var(--warning)}
.val-error{background:rgba(239,68,68,.10);border:1px solid var(--error)}
.val-banner-success{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.35)}
.val-banner-warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35)}
.val-banner-error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35)}
.val-row{display:flex;align-items:center;gap:9px;padding:3px 0;font-weight:500}

/* ===== EDITOR redesign ===== */
@keyframes ed-dash{to{background-position:200px 0,-200px 100%,0 -200px,100% 200px}}
@keyframes ed-pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* ===== MASCOTA VLIC ===== */
@keyframes vg-float{
  0%  {transform:translateY(0px)   rotate(-4deg) scale(1)}
  30% {transform:translateY(-16px) rotate(2deg)  scale(1.04)}
  60% {transform:translateY(-20px) rotate(5deg)  scale(1.05)}
  80% {transform:translateY(-8px)  rotate(1deg)  scale(1.02)}
  100%{transform:translateY(0px)   rotate(-4deg) scale(1)}
}
@keyframes vg-shadow{
  0%,100%{transform:scaleX(1)   translateX(-50%);opacity:.4}
  60%    {transform:scaleX(.55) translateX(-50%);opacity:.12}
}
@keyframes vg-glow{
  0%,100%{filter:drop-shadow(0 0 6px rgba(0,210,211,.5))  drop-shadow(0 16px 24px rgba(0,0,0,.25))}
  50%    {filter:drop-shadow(0 0 22px rgba(0,210,211,.9)) drop-shadow(0 16px 24px rgba(0,0,0,.25))}
}
@keyframes vg-bubble{0%{transform:scale(0) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes slideDown{0%{transform:translateY(-10px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wave{0%,100%{transform:scaleX(1) rotate(0deg)}50%{transform:scaleX(-1) rotate(0deg)}}
@keyframes vg-wave{
  0%,100%{transform:rotate(-4deg) scale(1)}
  50%    {transform:rotate(4deg)  scale(1)}
}

/* ===== VIGI PANEL — LUXURY EDITION ===== */
/* z-index 150: por encima del header (100) pero DEBAJO de overlays/modales (200+),
   para que la mascota no tape el QuickView ni el buscador. */
.vg-wrap{position:fixed;top:80px;right:24px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;}
.vg-btn{cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;pointer-events:all;animation:vg-float 3.2s ease-in-out infinite;position:relative;filter:drop-shadow(0 12px 32px rgba(27,42,74,.35));transition:all .28s cubic-bezier(0.34,1.56,0.64,1);}
.vg-btn img,.vg-btn video{width:180px;height:180px;object-fit:contain;display:block;animation:vg-glow 2.4s ease-in-out infinite;}
.vg-btn:hover{animation:none;transform:scale(1.12);}
.vg-btn:hover img,.vg-btn:hover video{animation:vg-wave .6s ease-in-out infinite, vg-glow 2.4s ease-in-out infinite;}
.vg-bubble{position:fixed;bottom:280px;right:24px;z-index:150;background:var(--bg);border:1px solid rgba(27,42,74,.08);border-radius:20px;padding:18px 20px;max-width:320px;min-width:260px;box-shadow:0 24px 64px rgba(27,42,74,.16), inset 0 1px 0 rgba(255,255,255,.5);animation:vg-bubble .4s cubic-bezier(0.34,1.56,0.64,1) forwards;}
.vg-bubble::after{content:'';position:absolute;bottom:-8px;right:40px;border:6px solid transparent;border-top-color:var(--bg);}

/* ===== PANEL CONTAINER ===== */
.vg-panel{position:fixed;bottom:200px;right:24px;z-index:150;width:380px;max-height:620px;background:var(--bg);border:1px solid rgba(27,42,74,.08);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 88px rgba(27,42,74,.22), inset 0 1px 0 rgba(255,255,255,.6);animation:vg-bubble .4s cubic-bezier(0.34,1.56,0.64,1) forwards;}

/* ===== HEADER PREMIUM ===== */
.vg-hdr{background:linear-gradient(135deg, rgba(27,42,74,.08) 0%, rgba(34,197,94,.04) 100%);backdrop-filter:blur(8px);padding:18px;display:flex;align-items:center;gap:14px;border-bottom:1.5px solid rgba(27,42,74,.1);}
.vg-hdr video,.vg-hdr img{width:120px;height:120px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 8px 24px rgba(34,197,94,.25));}
.vg-hdr-info{flex:1;min-width:0;}
.vg-hdr-name{font-size:16px;font-weight:900;color:var(--text);margin:0;letter-spacing:-0.02em;}
.vg-hdr-badge{display:flex;align-items:center;gap:6px;margin-top:4px;}
.vg-hdr-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6), 0 0 0 2px rgba(34,197,94,.2);animation:pulse 2.5s ease-in-out infinite;}
.vg-hdr-label{font-size:11px;color:var(--text-3);font-weight:600;margin:0;}
.vg-hdr-close{background:rgba(255,255,255,.12);border:none;border-radius:10px;width:36px;height:36px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0;backdrop-filter:blur(6px);}
.vg-hdr-close:hover{background:rgba(255,255,255,.22);transform:rotate(90deg);}
@keyframes pulse{0%{box-shadow:0 0 8px rgba(34,197,94,.6), 0 0 0 2px rgba(34,197,94,.2)} 50%{box-shadow:0 0 12px rgba(34,197,94,.8), 0 0 0 4px rgba(34,197,94,.15)} 100%{box-shadow:0 0 8px rgba(34,197,94,.6), 0 0 0 2px rgba(34,197,94,.2)}}

/* ===== TABS LUXURY ===== */
.vg-tabs{display:flex;background:linear-gradient(90deg, #f8f9fa 0%, #ffffff 50%, #f8f9fa 100%);border-bottom:1px solid rgba(27,42,74,.06);gap:1px;padding:4px;margin:0;}
.vg-tab{flex:1;padding:10px 6px;background:transparent;border:none;cursor:pointer;color:rgba(27,42,74,.5);font-size:11px;font-weight:700;text-align:center;transition:all .22s;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:0.02em;white-space:nowrap;}
.vg-tab.on{background:rgba(27,42,74,.08);color:var(--accent);font-weight:800;}

/* ===== BODY SCROLLABLE ===== */
.vg-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;}
.vg-body::-webkit-scrollbar{width:4px;}
.vg-body::-webkit-scrollbar-track{background:transparent;}
.vg-body::-webkit-scrollbar-thumb{background:rgba(27,42,74,.12);border-radius:10px;}
/* ===== NUEVO LAYOUT LINEAL ===== */
.vg-tagline{font-size:14px;font-weight:700;color:var(--text);margin:0;line-height:1.4;letter-spacing:0;}
.vg-cat-scroll{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 0;border-bottom:1px solid rgba(27,42,74,.05);}
.vg-cat-pill{padding:10px 12px;border-radius:10px;border:1.5px solid rgba(27,42,74,.15);background:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:normal;text-align:center;transition:all .2s cubic-bezier(0.34,1.56,0.64,1);color:var(--text);box-shadow:0 2px 6px rgba(27,42,74,.06);}
.vg-cat-pill:hover{border-color:var(--accent);background:rgba(34,197,94,.05);box-shadow:0 3px 10px rgba(27,42,74,.1);}
.vg-cat-pill.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800;box-shadow:0 4px 12px rgba(34,197,94,.3);}
.vg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;}
.vg-card{border-radius:12px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1;background:var(--surface);transition:all .25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 2px 8px rgba(27,42,74,.08);border:1.5px solid rgba(27,42,74,.06);}
.vg-card:hover{transform:scale(1.06) translateY(-2px);box-shadow:0 8px 18px rgba(27,42,74,.15);border-color:rgba(34,197,94,.2);}
.vg-card img{width:100%;height:100%;object-fit:cover;display:block;}
.vg-card-name{position:absolute;bottom:0;left:0;right:0;padding:20px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:10px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.01em;}
.vg-price-strip{display:flex;align-items:center;justify-content:space-around;background:linear-gradient(135deg,rgba(27,42,74,.05) 0%,rgba(34,197,94,.05) 100%);border-radius:14px;padding:16px 14px;gap:16px;border:1.5px solid rgba(27,42,74,.08);margin:6px 0;}
.vg-price-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.vg-price-item span{font-size:10px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.vg-price-item strong{font-size:16px;font-weight:900;color:var(--accent);letter-spacing:-0.01em;}
.vg-divider{width:1.5px;height:32px;background:rgba(27,42,74,.12);}
.vg-cta-primary{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--accent) 0%,#2b9a6f 100%);color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(34,197,94,.28);letter-spacing:0.01em;}
.vg-cta-primary:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(34,197,94,.35);}
.vg-cta-primary:active{transform:translateY(-1px);}
.vg-cta-secondary{width:100%;padding:12px;border-radius:12px;background:rgba(27,42,74,.03);color:var(--text-3);border:1.5px solid rgba(27,42,74,.1);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s;letter-spacing:0.01em;}
.vg-cta-secondary:hover{color:var(--accent);border-color:var(--accent);background:rgba(34,197,94,.06);}
.vg-cta-secondary:active{transform:scale(0.98);}

/* ===== TAB 0: INICIO ===== */
.vg-chat-bubble{background:linear-gradient(135deg, rgba(34,197,94,.08) 0%, rgba(34,197,94,.04) 100%);border:1px solid rgba(34,197,94,.25);border-radius:16px;padding:14px 16px;margin-bottom:0;}
.vg-chat-bubble p{font-size:13px;color:var(--text);line-height:1.7;margin:0;font-weight:500;}
.vg-benefits-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.vg-benefit-card{background:linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);border:1px solid rgba(27,42,74,.08);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:all .25s;cursor:default;}
.vg-benefit-card:hover{border-color:rgba(27,42,74,.15);background:linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);transform:translateY(-2px);}
.vg-benefit-icon-circle{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg, var(--accent-soft) 0%, rgba(34,197,94,.08) 100%);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px;}
.vg-benefit-label{font-size:10px;font-weight:700;color:var(--text);line-height:1.4;}
.vg-cta-primary{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg, var(--accent) 0%, #2b9a6f 100%);color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(34,197,94,.25);}
.vg-cta-primary:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(34,197,94,.35);}
.vg-cta-primary:active{transform:translateY(-1px);}
.vg-cta-outline{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);color:var(--accent);border:1.5px solid rgba(34,197,94,.3);cursor:pointer;font-size:13px;font-weight:800;font-family:inherit;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;}
.vg-cta-outline:hover{background:linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);border-color:var(--accent);box-shadow:0 4px 12px rgba(34,197,94,.15);}

/* ===== TAB 1: DISEÑOS ===== */
.vg-designs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.vg-dcard{border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer;transition:all .28s cubic-bezier(0.34,1.56,0.64,1);border:1px solid rgba(27,42,74,.08);position:relative;box-shadow:0 2px 6px rgba(27,42,74,.06);}
.vg-dcard:hover{transform:scale(1.06) translateY(-2px);border-color:rgba(34,197,94,.4);box-shadow:0 12px 32px rgba(27,42,74,.15);}
.vg-dcard-img{width:100%;height:150px;object-fit:cover;display:block;}
.vg-dcard-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.4) 50%, transparent 100%);padding:28px 12px 12px;color:#fff;font-size:12px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.01em;}

/* ===== TAB 2: TAMAÑO ===== */
.vg-orient-toggle{display:flex;gap:8px;margin-bottom:14px;}
.vg-toggle-btn{flex:1;padding:11px;border-radius:11px;border:1.5px solid rgba(27,42,74,.1);background:linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);cursor:pointer;font-size:11px;font-weight:700;color:var(--text);transition:all .22s;box-shadow:0 1px 3px rgba(27,42,74,.04);}
.vg-toggle-btn.on{border-color:var(--accent);background:linear-gradient(135deg, var(--accent-soft) 0%, rgba(34,197,94,.08) 100%);color:var(--accent);font-weight:800;}
.vg-sizes-grid{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.vg-size-option{padding:11px;border-radius:11px;border:1.5px solid rgba(27,42,74,.1);background:linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);cursor:pointer;font-size:12px;font-weight:700;color:var(--text);transition:all .22s;text-align:center;box-shadow:0 1px 3px rgba(27,42,74,.04);}
.vg-size-option.on{border-color:var(--accent);background:linear-gradient(135deg, var(--accent-soft) 0%, rgba(34,197,94,.08) 100%);color:var(--accent);font-weight:800;}
.vg-price-card{background:linear-gradient(135deg, rgba(27,42,74,.04) 0%, rgba(34,197,94,.04) 100%);border:1px solid rgba(27,42,74,.08);border-radius:14px;padding:18px;text-align:center;box-shadow:inset 0 1px 2px rgba(255,255,255,.5);}
.vg-price-label{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;margin-bottom:6px;letter-spacing:0.08em;}
.vg-price-big{font-size:38px;font-weight:900;color:var(--accent);letter-spacing:-0.03em;line-height:1;margin:0;}

/* ===== TAB 3: CREA TU FOTO ===== */
.vg-step-indicator{display:flex;align-items:center;gap:0;margin-bottom:16px;width:100%;}
.vg-step-dot{width:30px;height:30px;border-radius:50%;background:rgba(27,42,74,.1);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;transition:all .25s;}
.vg-step-dot.on{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(34,197,94,.15);}
.vg-step-dot.done{background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%);color:#fff;}
.vg-step-line{flex:1;height:2px;background:rgba(27,42,74,.08);transition:all .25s;}
.vg-step-line.active{background:var(--accent);}

.vg-gen-label{font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;}
.vg-gen-textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid rgba(27,42,74,.1);background:linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);font-size:13px;font-weight:500;color:var(--text);resize:none;min-height:80px;font-family:inherit;outline:none;transition:all .22s;box-shadow:0 1px 3px rgba(27,42,74,.04);}
.vg-gen-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.15), 0 1px 3px rgba(27,42,74,.04);}
.vg-cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
.vg-cat-option{padding:11px 6px;border-radius:11px;border:1.5px solid rgba(27,42,74,.1);background:linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);cursor:pointer;font-size:13px;font-weight:700;text-align:center;color:var(--text);transition:all .22s;box-shadow:0 1px 2px rgba(27,42,74,.03);}
.vg-cat-option.on{border-color:var(--accent);background:linear-gradient(135deg, var(--accent-soft) 0%, rgba(34,197,94,.08) 100%);color:var(--accent);font-weight:800;}
.vg-estilo-pills{display:flex;flex-wrap:wrap;gap:6px;}
.vg-estilo-pill{padding:7px 12px;border-radius:999px;border:1.5px solid rgba(27,42,74,.1);background:linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);cursor:pointer;font-size:10px;font-weight:700;color:var(--text);transition:all .22s;box-shadow:0 1px 2px rgba(27,42,74,.03);}
.vg-estilo-pill:hover{border-color:rgba(34,197,94,.2);}
.vg-estilo-pill.on{border-color:var(--accent);background:linear-gradient(135deg, var(--accent) 0%, #2b9a6f 100%);color:#fff;font-weight:800;}
.vg-gen-btn{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg, #1B2A4A 0%, #2563eb 50%, #1B2A4A 100%);background-size:200% 100%;color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(27,42,74,.25);}
.vg-gen-btn:hover{background-position:100%;transform:translateY(-2px);box-shadow:0 12px 28px rgba(27,42,74,.3);}

.vg-prompt-box{background:linear-gradient(135deg, #0f1e38 0%, #1a2d4a 100%);border:1.5px solid rgba(34,197,94,.4);border-radius:12px;padding:14px;font-family:'Menlo', 'Monaco', monospace;font-size:11px;line-height:1.7;color:#e8f5e9;word-break:break-word;box-shadow:inset 0 1px 3px rgba(0,0,0,.2);}
.vg-copy-btn{width:100%;padding:11px;border-radius:11px;border:1.5px solid rgba(34,197,94,.4);background:transparent;color:#22c55e;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit;transition:all .25s;font-variant-numeric:tabular-nums;}
.vg-copy-btn:hover{background:rgba(34,197,94,.08);border-color:var(--accent);}
.vg-copy-btn.copied{background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%);color:#fff;border-color:transparent;}
.vg-ai-platforms{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.vg-ai-dalle,.vg-ai-mj,.vg-ai-sd{padding:9px 6px;border-radius:10px;border:none;cursor:pointer;font-size:10px;font-weight:800;font-family:inherit;transition:all .22s;text-align:center;color:#fff;font-variant-numeric:tabular-nums;}
.vg-ai-dalle{background:linear-gradient(135deg, #00a67e 0%, #00875e 100%);}
.vg-ai-mj{background:linear-gradient(135deg, #111 0%, #1a1a1a 100%);}
.vg-ai-sd{background:linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);}
.vg-ai-dalle:hover,.vg-ai-mj:hover,.vg-ai-sd:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.2);}
/* step indicator */
.ed-step{display:flex;align-items:center;gap:8px}
.ed-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;flex:none;transition:all .25s var(--ease);
  background:var(--surface-2);color:var(--text-3);border:1.5px solid var(--line-2)}
.ed-dot.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ed-dot.done{background:var(--success);color:#fff;border-color:var(--success)}
.ed-step-lbl{font-size:12.5px;font-weight:700;color:var(--text-3);transition:color .25s}
.ed-step-lbl.act{color:var(--text)}
.ed-conn{width:34px;height:2px;border-radius:2px;background:var(--line-2);transition:background .3s;flex:none}
.ed-conn.act{background:var(--success)}
/* floating pill tabs */
.ed-pills{display:flex;gap:6px;padding:6px;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.ed-pill{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-size:13px;
  font-weight:700;color:var(--text-2);transition:all .2s var(--ease);white-space:nowrap}
.ed-pill:hover{background:var(--accent-soft);color:var(--text)}
.ed-pill.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(27,42,74,.28)}
.ed-pill .e{font-size:15px;line-height:1}
/* search */
.ed-search{position:relative}
.ed-search input{width:100%;background:var(--bg);border:1.5px solid var(--line-2);border-radius:12px;
  padding:12px 14px 12px 42px;font-size:14px;color:var(--text);transition:border-color .18s,box-shadow .18s;outline:none}
.ed-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ed-search input::placeholder{color:var(--text-3)}
.ed-search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
/* category chips with emoji */
.ed-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;
  font-weight:700;white-space:nowrap;background:var(--surface);border:1px solid var(--line-2);
  color:var(--text-2);transition:all .18s}
.ed-chip:hover{border-color:var(--line-hover);color:var(--text)}
.ed-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ed-chip .e{font-size:14px;line-height:1}
/* gallery card */
.ed-card{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;padding:0;cursor:pointer;
  border:2.5px solid transparent;background:var(--surface-2);transition:border-color .2s,box-shadow .2s,transform .2s}
.ed-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s var(--ease)}
.ed-card:hover img{transform:scale(1.06)}
.ed-card:hover{box-shadow:0 8px 22px rgba(0,0,0,.12)}
.ed-card.on{border-color:var(--accent);box-shadow:0 6px 20px rgba(27,42,74,.22)}
.ed-card.on img{transform:scale(1.06)}
.ed-card-ov{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent);
  color:#fff;font-size:10.5px;font-weight:700;text-align:left;
  opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-card:hover .ed-card-ov{opacity:1;transform:none}
.ed-check{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:ed-pop .3s var(--ease)}
.ed-card-name{font-size:11px;font-weight:600;color:var(--text);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* big dropzone */
.ed-drop{border-radius:18px;text-align:center;padding:48px 28px;cursor:pointer;transition:transform .2s,box-shadow .2s;
  background:var(--bg);
  background-image:
    linear-gradient(90deg,var(--line-hover) 50%,transparent 50%),
    linear-gradient(90deg,var(--line-hover) 50%,transparent 50%),
    linear-gradient(0deg,var(--line-hover) 50%,transparent 50%),
    linear-gradient(0deg,var(--line-hover) 50%,transparent 50%);
  background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;
  background-size:14px 2px,14px 2px,2px 14px,2px 14px;
  background-position:0 0,0 100%,0 0,100% 0}
.ed-drop:hover{transform:translateY(-1px)}
.ed-drop.drag{background-image:
    linear-gradient(90deg,var(--accent) 50%,transparent 50%),
    linear-gradient(90deg,var(--accent) 50%,transparent 50%),
    linear-gradient(0deg,var(--accent) 50%,transparent 50%),
    linear-gradient(0deg,var(--accent) 50%,transparent 50%);
  animation:ed-dash 6s linear infinite;
  box-shadow:0 0 0 4px var(--accent-soft),0 12px 32px rgba(27,42,74,.18)}
.ed-drop-ic{width:76px;height:76px;border-radius:22px;margin:0 auto 18px;display:flex;align-items:center;
  justify-content:center;background:var(--accent-soft);color:var(--accent);transition:transform .25s var(--ease)}
.ed-drop.drag .ed-drop-ic{transform:scale(1.08) translateY(-2px)}
/* orientation visual buttons */
.ed-orient{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 8px;border-radius:12px;
  cursor:pointer;background:var(--bg);border:1.5px solid var(--line-2);transition:all .18s}
.ed-orient:hover{border-color:var(--line-hover)}
.ed-orient.on{border-color:var(--accent);background:var(--accent-soft)}
.ed-orient .gl{border:2.5px solid var(--text-3);border-radius:3px;transition:border-color .18s}
.ed-orient.on .gl{border-color:var(--accent)}
.ed-orient .lbl{font-size:11px;font-weight:700;color:var(--text-3);transition:color .18s}
.ed-orient.on .lbl{color:var(--accent)}
/* size cards */
.ed-size{flex:1;text-align:center;padding:13px 8px;border-radius:12px;cursor:pointer;
  background:var(--bg);border:1.5px solid var(--line-2);transition:all .18s}
.ed-size:hover{border-color:var(--line-hover)}
.ed-size.on{border-color:var(--accent);background:var(--accent-soft)}
.ed-size .num{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
.ed-size.on .num{color:var(--accent)}
.ed-size .pr{font-size:11px;color:var(--text-3);margin-top:2px}
/* text color circles */
.ed-tcol{width:28px;height:28px;border-radius:50%;cursor:pointer;flex:none;transition:transform .15s,box-shadow .15s;
  position:relative}
.ed-tcol:hover{transform:scale(1.1)}
.ed-tcol.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

/* tabs underline */
.tabs{display:flex;border-bottom:1px solid var(--line);gap:4px}
.tab{padding:14px 16px;font-size:14px;font-weight:700;color:var(--text-2);position:relative;transition:color .18s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.chip{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line-2);color:var(--text-2);transition:all .18s}
.chip:hover{border-color:var(--line-hover);color:var(--text)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* steps breadcrumb */
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-3)}
.step.on{color:var(--accent)}
.step.done{color:var(--success)}
.step .num{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px}
.step.on .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.step.done .num{background:var(--success);color:#04160a;border-color:var(--success)}
.step-line{flex:1;height:1px;background:var(--line-2);min-width:18px;max-width:60px}
.step-line.act{background:var(--accent)}

/* progress (checkout) */
.prog-bar{height:3px;background:var(--line-2);border-radius:3px;flex:1;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s var(--ease)}

/* color swatches */
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.swatch:hover{transform:scale(1.12)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

/* ============================================================
   ANIMATIONS
============================================================ */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{100%{transform:translateX(100%)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 16px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.page{animation:fade .25s ease}
.reveal{animation:slideUp .5s var(--ease) both}
.pulse-badge{animation:pulse 1.8s ease-in-out infinite}
.pulse-ring{animation:pulseRing 1.8s ease-out infinite}
.float{animation:floaty 5s ease-in-out infinite}
.stagger>*{animation:slideUp .5s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.04s}
.stagger>*:nth-child(2){animation-delay:.10s}
.stagger>*:nth-child(3){animation-delay:.16s}
.stagger>*:nth-child(4){animation-delay:.22s}
.stagger>*:nth-child(5){animation-delay:.28s}
.stagger>*:nth-child(6){animation-delay:.34s}
.stagger>*:nth-child(7){animation-delay:.40s}
.stagger>*:nth-child(8){animation-delay:.46s}

/* misc */
.divider{height:1px;background:var(--line);width:100%}
.link-accent{color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:5px;transition:gap .18s}
.link-accent:hover{gap:9px}
.rating-star{color:var(--accent)}
.bar-track{height:7px;background:var(--line-2);border-radius:999px;overflow:hidden;flex:1}
.bar-fill{height:100%;background:var(--accent);border-radius:999px}

/* responsive visibility */
.show-md{display:none}
@media(max-width:900px){.hide-md{display:none !important}.show-md{display:flex !important}}
@media(max-width:520px){.hide-sm{display:none !important}}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.5fr;gap:40px}
@media(max-width:900px){.foot-grid{grid-template-columns:1fr 1fr;gap:32px}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
/* split layouts */
.split-2{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media(max-width:900px){.split-2{grid-template-columns:1fr;gap:32px}}
.cat-layout{display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:start}
@media(max-width:900px){.cat-layout{grid-template-columns:1fr}}
.cart-layout{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start}
@media(max-width:900px){.cart-layout{grid-template-columns:1fr}}
.editor-split{display:grid;grid-template-columns:minmax(360px,40%) 1fr;flex:1;min-height:0;overflow:hidden}
@media(max-width:900px){.editor-split{grid-template-columns:1fr;height:auto}}
.howto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;position:relative}
.howto-grid::before{content:"";position:absolute;top:42px;left:16%;right:16%;height:1px;background:var(--line-2);z-index:0}
@media(max-width:768px){.howto-grid{grid-template-columns:1fr;gap:40px}.howto-grid::before{display:none}}
/* ---------- HERO (editorial, single hero artwork) ---------- */
.home-hero{position:relative;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;
  min-height:100vh;overflow:hidden;background:
  radial-gradient(80% 60% at 78% 30%,rgba(27,42,74,.10),transparent 60%),
  radial-gradient(70% 80% at 12% 88%,rgba(35,40,55,.7),transparent 55%),
  #11131A}
.hero-copy{position:relative;z-index:2;padding:140px 56px 96px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.hero-eyebrow::before{content:"";width:28px;height:1px;background:var(--accent);opacity:.7}
.hero-h{font-family:var(--serif);font-weight:500;font-size:clamp(40px,5vw,72px);line-height:1.0;
  letter-spacing:-.02em;margin-bottom:24px}
.hero-h em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:clamp(15px,1.3vw,18px);color:var(--text-2);max-width:440px;line-height:1.65;margin-bottom:38px}
.hero-trust{display:flex;gap:26px;flex-wrap:wrap;margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.hero-trust .ti{display:flex;flex-direction:column;gap:3px}
.hero-trust .ti b{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--text)}
.hero-trust .ti span{font-size:12px;color:var(--text-3);letter-spacing:.02em}

/* single framed hero artwork — the museum wall */
.hero-stage{position:relative;z-index:1;height:100vh;display:flex;align-items:center;justify-content:center;padding:0 56px}
.hero-art{position:relative;width:min(70%,420px);aspect-ratio:3/4;
  background:linear-gradient(140deg,#caa863,#7c5f30 48%,#4a3819);padding:18px;border-radius:3px;
  box-shadow:0 50px 90px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.4),0 2px 0 rgba(255,255,255,.14) inset;
  transform:perspective(1400px) rotateY(-7deg) rotateX(1.5deg);transition:transform .6s var(--ease)}
.hero-art:hover{transform:perspective(1400px) rotateY(-3deg) rotateX(.5deg) translateY(-6px)}
.hero-art .matte{background:#0b0c10;padding:0;border-radius:1px;overflow:hidden;height:100%;
  box-shadow:0 0 0 1px rgba(0,0,0,.7) inset}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.hero-art .tag{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:rgba(17,19,26,.85);backdrop-filter:blur(8px);border:1px solid var(--line-2);
  border-radius:999px;padding:7px 16px;font-size:12px;color:var(--text-2);box-shadow:var(--shadow)}
.hero-art .tag b{color:var(--accent);font-weight:600}
/* floating accent thumbnails — subtle, secondary */
.hero-thumb{position:absolute;border-radius:8px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);
  border:1px solid var(--line-2);z-index:2;transition:transform .5s var(--ease)}
.hero-thumb img{width:100%;height:100%;object-fit:cover}
.hero-thumb.t1{width:104px;aspect-ratio:3/4;top:16%;right:8%;transform:rotate(4deg)}
.hero-thumb.t2{width:92px;aspect-ratio:3/4;bottom:14%;left:4%;transform:rotate(-5deg)}
.home-hero:hover .hero-thumb.t1{transform:rotate(4deg) translateY(-8px)}
.home-hero:hover .hero-thumb.t2{transform:rotate(-5deg) translateY(8px)}

.hero-bg-mobile{display:none}
@media(max-width:900px){
  .home-hero{grid-template-columns:1fr;min-height:auto;text-align:center}
  .hero-stage{display:none}
  .hero-bg-mobile{display:block;position:absolute;inset:0;z-index:0}
  .hero-copy{grid-column:1;padding:128px 24px 80px;z-index:2}
  .hero-eyebrow{justify-content:center}
  .hero-sub{margin-left:auto;margin-right:auto}
  .hero-trust{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;max-width:300px;margin-left:auto;margin-right:auto;justify-items:center}
  .upload-band{grid-template-columns:1fr !important;gap:32px !important}
}
.rev-grid{display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:center}
@media(max-width:640px){.rev-grid{grid-template-columns:1fr;gap:24px}}
.masonry{column-count:5;column-gap:16px}
@media(max-width:1200px){.masonry{column-count:4}}
@media(max-width:900px){.masonry{column-count:3}}
@media(max-width:640px){.masonry{column-count:2;column-gap:12px}}
.qv-grid{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:760px){.qv-grid{grid-template-columns:1fr}}
.pg-btn{min-width:38px;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);
  color:var(--text-2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pg-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ===== ADMIN PANEL ===== */
/* ===== ADMIN DESIGN TOKENS (scoped) ===== */
.adm-layout{
  --a-bg:#FAFAF8; --a-section:#F5F3EF; --a-card:#FFFFFF;
  --a-elevated:#F8F9FB;
  --a-head:#111111; --a-body:#4A5568; --a-muted:#8B92A0;
  --a-primary:#1B2A4A; --a-primary-soft:rgba(27,42,74,.08);
  --a-success:#22C55E; --a-error:#DC2626; --a-warning:#F59E0B; --a-info:#3B82F6;
  --a-border:#E5E7EB; --a-border-md:#D1D5DB;
  --a-sh-sm:0 1px 2px rgba(17,24,39,.06);
  --a-sh-md:0 4px 12px rgba(17,24,39,.08);
  --a-sh-lg:0 12px 32px rgba(17,24,39,.12);
  --a-r-xs:4px; --a-r-sm:6px; --a-r-md:8px; --a-r-lg:12px; --a-r-xl:16px;
  --a-t:150ms cubic-bezier(.4,0,.2,1);
}
.adm-layout{display:grid;grid-template-columns:248px 1fr;height:100vh;background:var(--a-bg)}
.adm-side{background:var(--a-card);border-right:1px solid var(--a-border);padding:20px 12px;display:flex;flex-direction:column;overflow-y:auto}
.adm-navi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--a-r-md);color:var(--a-body);font-size:14px;font-weight:500;width:100%;text-align:left;transition:background var(--a-t),color var(--a-t);position:relative}
.adm-navi:hover{background:var(--a-primary-soft);color:var(--a-primary)}
.adm-navi.on{background:var(--a-primary-soft);color:var(--a-primary);font-weight:600}
.adm-navi.on::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;background:var(--a-primary)}
.adm-top{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--a-border);background:var(--a-card);color:var(--a-head);box-shadow:var(--a-sh-sm)}
.adm-main{flex:1;overflow-y:auto;padding:28px;background:var(--a-bg)}
.adm-main-inner{max-width:1240px;margin-inline:auto}
.adm-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--a-card);border:1px solid var(--a-border);border-radius:var(--a-r-lg);padding:20px;box-shadow:var(--a-sh-sm);transition:transform var(--a-t),box-shadow var(--a-t)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--a-sh-md)}
.adm-2col{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
.adm-table{width:100%;border-collapse:collapse;font-size:14px}
.adm-table th{text-align:left;padding:13px 16px;font-size:12px;color:var(--a-muted);font-weight:600;border-bottom:1px solid var(--a-border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.adm-table td{padding:12px 16px;border-bottom:1px solid var(--a-border);vertical-align:middle;color:var(--a-body)}
.adm-table tbody tr{transition:background var(--a-t)}
.adm-table tbody tr:hover{background:var(--a-elevated)}
.adm-table tbody tr:last-child td{border-bottom:none}
.adm-table.striped tbody tr:nth-child(even){background:var(--a-elevated)}
.adm-table.striped tbody tr:nth-child(even):hover{background:var(--a-primary-soft)}
.adm-table .num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.adm-table.dense th,.adm-table.dense td{padding:8px 12px}
.adm-drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--a-card);border-left:1px solid var(--a-border);z-index:61;padding:28px;overflow-y:auto;animation:slideR .3s var(--ease);box-shadow:var(--a-sh-lg)}
.adm-search{display:flex;align-items:center;gap:8px;background:var(--a-card);border:1px solid var(--a-border);border-radius:999px;padding:7px 12px;transition:box-shadow var(--a-t),border-color var(--a-t)}
.adm-search:focus-within{border-color:var(--a-primary);box-shadow:0 0 0 3px var(--a-primary-soft)}
.adm-layout .card{background:var(--a-card);border-color:var(--a-border);box-shadow:var(--a-sh-sm)}
.adm-check{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:6px;border:2px solid #fff;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.adm-star{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
@media(max-width:900px){
  .adm-layout{grid-template-columns:64px 1fr}
  .adm-side .lbl{display:none}
  .adm-navi{justify-content:center;padding:10px 0}
  .adm-kpis{grid-template-columns:repeat(2,1fr)}
  .adm-2col{grid-template-columns:1fr}
  .adm-main{padding:16px}
}

/* ============================================================
   SCROLL SHOWCASE + LIGHT-MODE OVERRIDES
============================================================ */
/* Remover scrollbar del showcase sin perder funcionalidad */
#showcase::-webkit-scrollbar { display: none; }

/* Showcase slide reveal */
.showcase-slide { transition: background .3s; }

/* Eyebrow text (brand) */
.eyebrow{
  font-size:11px !important;font-weight:700 !important;letter-spacing:.12em !important;
  text-transform:uppercase !important;color:var(--accent) !important;
}

/* Cards / tiles light mode */
.card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile{background:var(--surface);border:1px solid var(--line)}

/* Nav light mode */
nav, header{}

/* Mobile: showcase a una columna, imagen como fondo, copy encima */
@media(max-width:768px){
  .showcase-slide{grid-template-columns:1fr !important}
  .showcase-slide > div:first-child{position:absolute !important;inset:0;z-index:0}
  .showcase-slide img{opacity:.30}
  .showcase-slide > div:nth-child(2){position:relative;z-index:1}
}

/* ============================================================
   QA FIXES — responsive, accesibilidad y motion
============================================================ */
/* UploadPanel: el split 40/60 se apila en móvil para no aplastar ambos paneles */
@media(max-width:768px){
  .upl-split{flex-direction:column !important;height:auto !important}
  .upl-left,.upl-right{width:100% !important}
  .upl-left{border-right:none !important;border-bottom:1px solid rgba(34,197,94,.15)}
}

/* Editor: usar dvh para no romper con el teclado virtual en móvil (iOS/Android).
   El 100vh fijo dejaba el preview fuera de la pantalla cuando aparece el teclado. */
.editor-shell{height:100vh;height:100dvh}
@media(max-width:900px){
  .editor-shell{height:auto;min-height:100dvh;overflow:visible !important}
  .editor-split{height:auto}
  /* El preview necesita una altura mínima usable cuando los paneles se apilan */
  .editor-split > div:last-child{min-height:60vh}
}

/* Accesibilidad: anillo de foco visible para teclado en TODOS los controles.
   Antes los botones/enlaces/cards no mostraban foco (WCAG 2.4.7 fallaba). */
a:focus-visible,
button:focus-visible,
.btn:focus-visible,
.chip:focus-visible,
.ed-pill:focus-visible,
.pg-btn:focus-visible,
.icon-btn:focus-visible,
.heart:focus-visible,
[tabindex]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}

/* Inputs táctiles: altura mínima 44px en móvil (objetivo táctil WCAG 2.5.5) */
@media(max-width:768px){
  .input,.textarea,.select{min-height:44px}
}

/* Respeta "reducir movimiento": detiene animaciones infinitas y spinners
   (mascota, glow, pulse, shimmer) para usuarios sensibles / anti-mareo. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .spin{animation:rot 1.2s linear infinite !important;border-top-color:var(--accent)}
}
</style>

/* ============================================================
   GLOBAL CONTEXT (navigation, toasts, wishlist)
============================================================ */
const Store = createContext(null);
const useStore = () => useContext(Store);

let toastId = 0;
function StoreProvider({children}){
  const [view,setView] = useState('home');
  const [viewData,setViewData] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [wishlist,setWishlist] = useState(()=>{
    try {
      const saved = localStorage.getItem('turbohogar_wishlist');
      return saved ? new Set(JSON.parse(saved)) : new Set([1,3,6,12,18]);
    } catch(e) { return new Set([1,3,6,12,18]); }
  });
  useEffect(()=>{
    try { localStorage.setItem('turbohogar_wishlist', JSON.stringify([...wishlist])); } catch(e){}
  }, [wishlist]);
  const [drawer,setDrawer] = useState(false);
  const [search,setSearch] = useState(false);
  const [discount,setDiscount] = useState(null); // {code, amount} | null
  const [customer,setCustomer] = useState(null); // datos del cliente capturados en checkout
  const [lastOrder,setLastOrder] = useState(null); // resumen del pedido confirmado
  const [cartItems,setCartItems] = useState(()=>{
    try {
      const saved = localStorage.getItem('turbohogar_cart');
      return saved ? JSON.parse(saved) : [];
    } catch(e) {
      return [];
    }
  });

  useEffect(()=>{
    localStorage.setItem('turbohogar_cart', JSON.stringify(cartItems));
  }, [cartItems]);

  const navigate = (v,data=null)=>{ setView(v); setViewData(data); setDrawer(false); setSearch(false);
    window.scrollTo({top:0,behavior:'smooth'}); };

  const addToast = (msg,type='success')=>{
    const id = ++toastId;
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000);
  };
  const closeToast = id => setToasts(t=>t.filter(x=>x.id!==id));

  const toggleWish = (id)=>{
    setWishlist(prev=>{
      const next = new Set(prev);
      if(next.has(id)){ next.delete(id); addToast('Eliminado de tus diseños','error'); }
      else { next.add(id); addToast('Guardado en tus diseños 💜'); }
      return next;
    });
  };

  const addToCart = (item)=>{
    setCartItems(prev=>{
      const existing = prev.find(i=>i.id===item.id);
      if(existing){ return prev.map(i=>i.id===item.id?{...i,qty:i.qty+(item.qty||1)}:i); }
      return [...prev, {id: item.id || Date.now(), ...item, qty: item.qty||1}];
    });
    addToast('Agregado al carrito ✓');
  };

  const removeFromCart = (id,name)=>{
    setCartItems(prev=>prev.filter(i=>i.id!==id));
    addToast(name+' eliminado del carrito','error');
  };

  const updateCartQty = (id,qty)=>{
    setCartItems(prev=>qty<=0?prev.filter(i=>i.id!==id):prev.map(i=>i.id===id?{...i,qty}:i));
  };

  const clearCart = ()=>{ setCartItems([]); setDiscount(null); };

  return <Store.Provider value={{view,viewData,navigate,toasts,addToast,closeToast,wishlist,toggleWish,drawer,setDrawer,search,setSearch,cartItems,setCartItems,addToCart,removeFromCart,updateCartQty,clearCart,discount,setDiscount,customer,setCustomer,lastOrder,setLastOrder}}>
    {children}
  </Store.Provider>;
}

/* ============================================================
   SCROLL SHOWCASE — secciones full-screen, mockups protagonistas
============================================================ */
function ScrollShowcase(){
  const {navigate} = useStore();
  const [visible, setVisible] = useState({});
  const [active, setActive] = useState(0);
  const sectionRef = useRef();

  // Un diseño por categoría, rotando entre los 3 mockups disponibles (comun, a, b)
  const slides = useMemo(()=>{
    const cats = ['DC COMICS','MARVEL','FUNKO','JUEGOS','PELICULAS','SERIES TV'];
    const mockupKeys = ['comun','a','b','comun','a','b'];
    return cats.map((cat,i)=>{
      const d = DESIGNS.find(x=>x.cat===cat);
      if(!d) return null;
      return {...d, activeMock: d.mock[mockupKeys[i]] || d.mock.comun};
    }).filter(Boolean);
  },[]);

  // IntersectionObserver: revela animaciones Y actualiza punto activo
  useEffect(()=>{
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        const i = parseInt(e.target.dataset.idx);
        if(e.isIntersecting){
          setVisible(v=>({...v,[i]:true}));
          setActive(i);
        }
      });
    },{threshold:0.5, root: sectionRef.current});
    document.querySelectorAll('.showcase-slide').forEach(el=>obs.observe(el));
    return ()=>obs.disconnect();
  },[]);

  // Scroll programático al hacer click en un punto
  const goToSlide = (i) => {
    const el = document.querySelector(`.showcase-slide[data-idx="${i}"]`);
    if(el) el.scrollIntoView({behavior:'smooth'});
  };

  // Fondos alternos suaves para dar variedad entre slides
  const bgs = ['#FAFAF8','#F0EDE8','#FAFAF8','#EEF0F4','#FAFAF8','#F0EDE8'];

  return (
    <section ref={sectionRef} style={{scrollSnapType:'y mandatory',overflowY:'scroll',height:'100vh',
      scrollbarWidth:'none',position:'relative'}} id="showcase">

      {/* ── Puntos de navegación lateral ── */}
      <div style={{
        position:'fixed',right:28,top:'50%',transform:'translateY(-50%)',
        zIndex:100,display:'flex',flexDirection:'column',gap:10,
        opacity: active >= 0 ? 1 : 0, transition:'opacity .3s'
      }}>
        {slides.map((_,i)=>(
          <button key={i} onClick={()=>goToSlide(i)}
            title={slides[i].cat}
            style={{
              width: active===i ? 10 : 7,
              height: active===i ? 10 : 7,
              borderRadius:'50%',
              background: active===i ? 'var(--accent)' : 'rgba(27,42,74,.25)',
              border: active===i ? '2px solid var(--accent)' : '2px solid rgba(27,42,74,.2)',
              padding:0,cursor:'pointer',
              transition:'all .3s cubic-bezier(.25,.46,.45,.94)',
              boxShadow: active===i ? '0 0 0 3px rgba(27,42,74,.15)' : 'none'
            }}/>
        ))}
      </div>

      {/* ── Etiqueta de sección visible al entrar ── */}
      <div style={{

    </section>

}

function Breadcrumbs({items}){
  const {navigate} = useStore();
  return <div className="flex ic g2 small muted" style={{marginBottom:20,flexWrap:'wrap'}}>
    {items.map((it,i)=>(
      <span key={i} className="flex ic g2">
        {i>0 && <Icon n="chevRight" s={13} c="var(--text-3)"/>}
        {it.to ? <a className="pointer" style={{transition:'color .15s'}}
            onMouseEnter={e=>e.target.style.color='var(--accent)'} onMouseLeave={e=>e.target.style.color=''}
            onClick={()=>navigate(it.to)}>{it.label}</a>
          : <span style={{color:'var(--text)'}}>{it.label}</span>}
      </span>
    ))}
  </div>;
}

function Checkbox({label,checked,onChange}){
  return <div className={"cbx"+(checked?" on":"")} onClick={onChange}>
    <span className="box"><Icon n="check" s={12} sw={3} c="#fff"/></span>{label}</div>;
}

function Accordion({items,defaultOpen=-1}){
  const [open,setOpen]=useState(defaultOpen);
  return <div>{items.map((it,i)=>(
    <div key={i} className={"acc-item"+(open===i?" open":"")}>
      <div className="acc-head" onClick={()=>setOpen(open===i?-1:i)}>
        <span>{it.q||it.title}</span><Icon n="chevDown" s={18} className="chev"/></div>
      <div className="acc-body"><p>{it.a||it.body}</p></div>
    </div>
  ))}</div>;
}

function Dropdown({value,options,onChange,placeholder,width=200}){
  const [open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  return <div className="rel" ref={ref} style={{minWidth:width}}>
    <button className="btn btn-outline full" style={{justifyContent:'space-between',padding:'10px 14px'}} onClick={()=>setOpen(!open)}>
      <span style={{fontWeight:500}}>{value||placeholder}</span><Icon n="chevDown" s={16}/></button>
    {open && <div className="dropdown" style={{position:'absolute',top:'calc(100% + 6px)',right:0,left:0,zIndex:20}}>
      {options.map(o=>(<div key={o} className={"dd-item"+(o===value?" on":"")}
        onClick={()=>{onChange(o);setOpen(false);}}>{o}{o===value&&<Icon n="check" s={15}/>}</div>))}
    </div>}
  </div>;
}

function MultiSelect({options,selected,onToggle,label}){
  const [open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  return <div className="rel" ref={ref}>
    <button className="btn btn-outline full" style={{justifyContent:'space-between',padding:'10px 14px'}} onClick={()=>setOpen(!open)}>
      <span style={{fontWeight:500}} className={selected.length?'':'muted'}>{selected.length?`${selected.length} seleccionadas`:label}</span>
      <Icon n="chevDown" s={16}/></button>
    {open && <div className="dropdown" style={{position:'absolute',top:'calc(100% + 6px)',left:0,right:0,zIndex:20,maxHeight:240,overflowY:'auto'}}>
      {options.map(o=>(<div key={o} className="dd-item" onClick={()=>onToggle(o)}>
        <Checkbox label={o} checked={selected.includes(o)} onChange={()=>onToggle(o)}/></div>))}
    </div>}
  </div>;
}

function DualRange({min,max,value,onChange,step=1000}){
  const [lo,hi]=value;
  const pct=v=>((v-min)/(max-min))*100;
  return <div>
    <div className="rel" style={{height:26,display:'flex',alignItems:'center'}}>
      <div style={{position:'absolute',left:0,right:0,height:4,borderRadius:999,background:'var(--line-2)'}}/>
      <div style={{position:'absolute',height:4,borderRadius:999,background:'var(--accent)',left:pct(lo)+'%',right:(100-pct(hi))+'%'}}/>
      <input type="range" min={min} max={max} step={step} value={lo} className="rng"
        style={{position:'absolute',left:0,right:0,background:'transparent',pointerEvents:'none',WebkitAppearance:'none'}}
        onChange={e=>onChange([Math.min(+e.target.value,hi-step),hi])}/>
      <input type="range" min={min} max={max} step={step} value={hi} className="rng"
        style={{position:'absolute',left:0,right:0,background:'transparent',pointerEvents:'none',WebkitAppearance:'none'}}
        onChange={e=>onChange([lo,Math.max(+e.target.value,lo+step)])}/>
    </div>
    <div className="flex ic jb small muted" style={{marginTop:8}}>
      <span>{CLP(lo)}</span><span>{CLP(hi)}</span>
    </div>
  </div>;
}

function Magnifier({src}){
  const [zoom,setZoom]=useState(false);
  const [pos,setPos]=useState({x:50,y:50});
  const move=e=>{const r=e.currentTarget.getBoundingClientRect();
    setPos({x:((e.clientX-r.left)/r.width)*100,y:((e.clientY-r.top)/r.height)*100});};
  return <div className="rel" style={{borderRadius:12,overflow:'hidden',cursor:'zoom-in',aspectRatio:'4/3',background:'var(--surface)'}}
    onMouseEnter={()=>setZoom(true)} onMouseLeave={()=>setZoom(false)} onMouseMove={move}>
    <img src={src} alt="" style={{width:'100%',height:'100%',objectFit:'cover',
      transform:zoom?'scale(1.8)':'scale(1)',transformOrigin:`${pos.x}% ${pos.y}%`,transition:zoom?'transform .05s':'transform .3s'}}/>
    <span className="pill pill-glass" style={{position:'absolute',bottom:12,right:12,opacity:zoom?0:1,transition:'opacity .2s'}}>
      <Icon n="zoomIn" s={13}/>Pasa el cursor para ampliar</span>
  </div>;
}
