    window.scrollTo({top:0,behavior:'smooth'}); };

  const addToast = (msg,type='success')=>{
    const id = ++toastId;
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000);
  };
  const closeToast = id => setToasts(t=>t.filter(x=>x.id!==id));

  const toggleWish = (id)=>{
    setWishlist(prev=>{
      const next = new Set(prev);
      if(next.has(id)){ next.delete(id); addToast('Eliminado de tus diseños','error'); }
      else { next.add(id); addToast('Guardado en tus diseños 💜'); }
      return next;
    });
  };

  const addToCart = (item)=>{
    setCartItems(prev=>{
      const existing = prev.find(i=>i.id===item.id);
      if(existing){ return prev.map(i=>i.id===item.id?{...i,qty:i.qty+(item.qty||1)}:i); }
      return [...prev, {id: item.id || Date.now(), ...item, qty: item.qty||1}];
    });
    addToast('Agregado al carrito ✓');
  };

  const removeFromCart = (id,name)=>{
    setCartItems(prev=>prev.filter(i=>i.id!==id));
    addToast(name+' eliminado del carrito','error');
  };

  const updateCartQty = (id,qty)=>{
    setCartItems(prev=>qty<=0?prev.filter(i=>i.id!==id):prev.map(i=>i.id===id?{...i,qty}:i));
  };

  const clearCart = ()=>{ setCartItems([]); setDiscount(null); };

  return <Store.Provider value={{view,viewData,navigate,toasts,addToast,closeToast,wishlist,toggleWish,drawer,setDrawer,search,setSearch,cartItems,setCartItems,addToCart,removeFromCart,updateCartQty,clearCart,discount,setDiscount,customer,setCustomer,lastOrder,setLastOrder}}>
    {children}
  </Store.Provider>;
}

/* ============================================================
   SCROLL SHOWCASE — secciones full-screen, mockups protagonistas
============================================================ */
function ScrollShowcase(){
  const {navigate} = useStore();
  const [visible, setVisible] = useState({});
  const [active, setActive] = useState(0);
  const sectionRef = useRef();

  // Un diseño por categoría, rotando entre los 3 mockups disponibles (comun, a, b)
  const slides = useMemo(()=>{
    const cats = ['DC COMICS','MARVEL','FUNKO','JUEGOS','PELICULAS','SERIES TV'];
    const mockupKeys = ['comun','a','b','comun','a','b'];
    return cats.map((cat,i)=>{
      const d = DESIGNS.find(x=>x.cat===cat);
      if(!d) return null;
      return {...d, activeMock: d.mock[mockupKeys[i]] || d.mock.comun};
    }).filter(Boolean);
  },[]);

  // IntersectionObserver: revela animaciones Y actualiza punto activo
  useEffect(()=>{
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        const i = parseInt(e.target.dataset.idx);
        if(e.isIntersecting){
          setVisible(v=>({...v,[i]:true}));
          setActive(i);
        }
      });
    },{threshold:0.5, root: sectionRef.current});
    document.querySelectorAll('.showcase-slide').forEach(el=>obs.observe(el));
    return ()=>obs.disconnect();
  },[]);

  // Scroll programático al hacer click en un punto
  const goToSlide = (i) => {
    const el = document.querySelector(`.showcase-slide[data-idx="${i}"]`);
    if(el) el.scrollIntoView({behavior:'smooth'});
  };

  // Fondos alternos suaves para dar variedad entre slides
  const bgs = ['#FAFAF8','#F0EDE8','#FAFAF8','#EEF0F4','#FAFAF8','#F0EDE8'];

  return (<>
    {/* ── Desktop: full-screen snap scroll (oculto en ≤768px) ── */}
    <section ref={sectionRef} className="showcase-desktop"
      style={{scrollSnapType:'y mandatory',overflowY:'scroll',height:'100vh',
      scrollbarWidth:'none',position:'relative'}} id="showcase">

      {/* ── Puntos de navegación lateral ── */}
      <div className="showcase-nav-dots" style={{
        position:'fixed',right:28,top:'50%',transform:'translateY(-50%)',
        zIndex:100,display:'flex',flexDirection:'column',gap:10,
        opacity: active >= 0 ? 1 : 0, transition:'opacity .3s'
      }}>
        {slides.map((_,i)=>(
          <button key={i} onClick={()=>goToSlide(i)}
            title={slides[i].cat}
            style={{
              width: active===i ? 10 : 7,
              height: active===i ? 10 : 7,
              borderRadius:'50%',
              background: active===i ? 'var(--accent)' : 'rgba(27,42,74,.25)',
              border: active===i ? '2px solid var(--accent)' : '2px solid rgba(27,42,74,.2)',
              padding:0,cursor:'pointer',
              transition:'all .3s cubic-bezier(.25,.46,.45,.94)',
              boxShadow: active===i ? '0 0 0 3px rgba(27,42,74,.15)' : 'none'
            }}/>
        ))}
      </div>

      {/* ── Etiqueta de sección visible al entrar ── */}
      <div className="showcase-side-label" style={{
        position:'fixed',left:28,top:'50%',transform:'translateY(-50%) rotate(-90deg)',
        transformOrigin:'center center',
        zIndex:100,fontSize:10,fontWeight:700,letterSpacing:'.18em',
        textTransform:'uppercase',color:'rgba(27,42,74,.35)',
        pointerEvents:'none', whiteSpace:'nowrap'
      }}>
        Diseños destacados · {String(active+1).padStart(2,'0')} / {String(slides.length).padStart(2,'0')}
      </div>

      {slides.map((d,i)=>{
        const imgLeft = i%2===0;
        return (
          <div key={d.id} data-idx={i} className="showcase-slide"
            style={{height:'100vh',scrollSnapAlign:'start',display:'grid',
              gridTemplateColumns: imgLeft ? '1fr 1fr' : '1fr 1fr',
              alignItems:'center',background:bgs[i]||'var(--bg)',
              position:'relative',overflow:'hidden'}}>

            {/* Panel imagen — fondo neutro con imagen contenida y con aire */}
            <div style={{
              order: imgLeft?0:1,
              height:'100%',
              display:'flex',alignItems:'center',justifyContent:'center',
              background: imgLeft ? 'rgba(0,0,0,.03)' : 'transparent',
              padding:'48px 40px'}}>
              <div style={{
                position:'relative',
                maxWidth:440,width:'100%',
                opacity: visible[i]?1:0,
                transform: visible[i]?'scale(1)':'scale(.94)',
                transition:'all 1s cubic-bezier(.25,.46,.45,.94)'}}>
                <img
                  src={d.activeMock}
                  alt={d.sub+' — '+d.cat}
                  loading="lazy"
                  style={{
                    width:'100%',height:'auto',
                    display:'block',
                    borderRadius:12,
                    boxShadow:'0 32px 80px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.10)'
                  }}/>
                {/* Miniatura de los otros mockups */}
                <div style={{position:'absolute',bottom:-16,right:-16,
                  display:'flex',gap:8}}>
                  {[d.mock.comun, d.mock.a, d.mock.b].filter(Boolean).map((src,mi)=>(
                    <div key={mi} style={{width:48,height:48,borderRadius:8,overflow:'hidden',
                      border:'2px solid #fff',boxShadow:'0 4px 12px rgba(0,0,0,.15)',
                      opacity: d.activeMock===src?1:.6}}>
                      <img src={src} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Panel copy */}
            <div className="showcase-copy" style={{
              order: imgLeft?1:0,
              padding:'0 64px',

function Breadcrumbs({items}){
  const {navigate} = useStore();
  return <div className="flex ic g2 small muted" style={{marginBottom:20,flexWrap:'wrap'}}>
    {items.map((it,i)=>(
      <span key={i} className="flex ic g2">

            onMouseEnter={e=>e.target.style.color='var(--accent)'} onMouseLeave={e=>e.target.style.color=''}
            onClick={()=>navigate(it.to)}>{it.label}</a>
          : <span style={{color:'var(--text)'}}>{it.label}</span>}
      </span>
    ))}
  </div>;
}

function Checkbox({label,checked,onChange}){
  return <div className={"cbx"+(checked?" on":"")} onClick={onChange}>
    <span className="box"><Icon n="check" s={12} sw={3} c="#fff"/></span>{label}</div>;
}

function Accordion({items,defaultOpen=-1}){
  const [open,setOpen]=useState(defaultOpen);
  return <div>{items.map((it,i)=>(
    <div key={i} className={"acc-item"+(open===i?" open":"")}>
      <div className="acc-head" onClick={()=>setOpen(open===i?-1:i)}>
        <span>{it.q||it.title}</span><Icon n="chevDown" s={18} className="chev"/></div>
      <div className="acc-body"><p>{it.a||it.body}</p></div>
    </div>
  ))}</div>;
}

function Dropdown({value,options,onChange,placeholder,width=200}){
  const [open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  return <div className="rel" ref={ref} style={{minWidth:width}}>
    <button className="btn btn-outline full" style={{justifyContent:'space-between',padding:'10px 14px'}} onClick={()=>setOpen(!open)}>
      <span style={{fontWeight:500}}>{value||placeholder}</span><Icon n="chevDown" s={16}/></button>
    {open && <div className="dropdown" style={{position:'absolute',top:'calc(100% + 6px)',right:0,left:0,zIndex:20}}>
      {options.map(o=>(<div key={o} className={"dd-item"+(o===value?" on":"")}
        onClick={()=>{onChange(o);setOpen(false);}}>{o}{o===value&&<Icon n="check" s={15}/>}</div>))}
    </div>}
  </div>;
}

function MultiSelect({options,selected,onToggle,label}){
  const [open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  return <div className="rel" ref={ref}>
    <button className="btn btn-outline full" style={{justifyContent:'space-between',padding:'10px 14px'}} onClick={()=>setOpen(!open)}>
      <span style={{fontWeight:500}} className={selected.length?'':'muted'}>{selected.length?`${selected.length} seleccionadas`:label}</span>
      <Icon n="chevDown" s={16}/></button>
    {open && <div className="dropdown" style={{position:'absolute',top:'calc(100% + 6px)',left:0,right:0,zIndex:20,maxHeight:240,overflowY:'auto'}}>
      {options.map(o=>(<div key={o} className="dd-item" onClick={()=>onToggle(o)}>
        <Checkbox label={o} checked={selected.includes(o)} onChange={()=>onToggle(o)}/></div>))}
    </div>}
  </div>;
}

function DualRange({min,max,value,onChange,step=1000}){
  const [lo,hi]=value;
  const pct=v=>((v-min)/(max-min))*100;
  return <div>
    <div className="rel" style={{height:26,display:'flex',alignItems:'center'}}>
      <div style={{position:'absolute',left:0,right:0,height:4,borderRadius:999,background:'var(--line-2)'}}/>
      <div style={{position:'absolute',height:4,borderRadius:999,background:'var(--accent)',left:pct(lo)+'%',right:(100-pct(hi))+'%'}}/>
      <input type="range" min={min} max={max} step={step} value={lo} className="rng"
        style={{position:'absolute',left:0,right:0,background:'transparent',pointerEvents:'none',WebkitAppearance:'none'}}
        onChange={e=>onChange([Math.min(+e.target.value,hi-step),hi])}/>
      <input type="range" min={min} max={max} step={step} value={hi} className="rng"
        style={{position:'absolute',left:0,right:0,background:'transparent',pointerEvents:'none',WebkitAppearance:'none'}}
        onChange={e=>onChange([lo,Math.max(+e.target.value,lo+step)])}/>
    </div>
    <div className="flex ic jb small muted" style={{marginTop:8}}>
      <span>{CLP(lo)}</span><span>{CLP(hi)}</span>
    </div>
  </div>;
}

function Magnifier({src}){
  const [zoom,setZoom]=useState(false);
  const [pos,setPos]=useState({x:50,y:50});
  const move=e=>{const r=e.currentTarget.getBoundingClientRect();
    setPos({x:((e.clientX-r.left)/r.width)*100,y:((e.clientY-r.top)/r.height)*100});};
  return <div className="rel" style={{borderRadius:12,overflow:'hidden',cursor:'zoom-in',aspectRatio:'4/3',background:'var(--surface)'}}
    onMouseEnter={()=>setZoom(true)} onMouseLeave={()=>setZoom(false)} onMouseMove={move}>
    <img src={src} alt="" style={{width:'100%',height:'100%',objectFit:'cover',
      transform:zoom?'scale(1.8)':'scale(1)',transformOrigin:`${pos.x}% ${pos.y}%`,transition:zoom?'transform .05s':'transform .3s'}}/>
    <span className="pill pill-glass" style={{position:'absolute',bottom:12,right:12,opacity:zoom?0:1,transition:'opacity .2s'}}>
      <Icon n="zoomIn" s={13}/>Pasa el cursor para ampliar</span>
  </div>;
}

  const [page,setPage]=useState(1);

  // Debounce rawQuery → query (200ms)

    const t=setTimeout(()=>{setQuery(rawQuery);setPage(1);},200);
    return ()=>clearTimeout(t);

    </div>
    <div className="scroll-x" style={{marginBottom:12}}>
      {CATS.map(c=>(<button key={c} className={"chip"+(cat===c?" on":"")} onClick={()=>setCat(c)}>{c}</button>))}
    </div>
    <div className="flex ic g2" style={{marginBottom:20}}>
      <span className="small muted" style={{marginRight:4}}>Orientación:</span>
      {[['Todas',null],['Vertical','vertical'],['Horizontal','horizontal']].map(([label,val])=>(
        <button key={label} className={"chip"+(orient===val?" on":"")} style={{fontSize:12,padding:'4px 12px'}}
          onClick={()=>setOrient(val)}>{label}</button>
      ))}
      {base.length>0 && <span className="small muted" style={{marginLeft:'auto'}}>{base.length} diseño{base.length!==1?'s':''}</span>}
    </div>

    {loading ? <SkeletonGrid/> : shown.length>0 ? (
      <div className="masonry">
        {shown.map(d=>(<GalleryCard key={d.id} d={d} onQuick={handleCardTap}/>))}

      <div style={{textAlign:'center',padding:'80px 24px',background:'linear-gradient(135deg, var(--bg), var(--surface))',borderRadius:12,minHeight:'300px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <div style={{width:96,height:96,borderRadius:'50%',background:'var(--accent-soft)',

          <Icon n="search" s={40} c="var(--accent)"/>

        <h3 style={{fontSize:20,fontWeight:900,color:'var(--accent)',marginBottom:10,letterSpacing:'-.01em'}}>{rawQuery?`Sin resultados para "${rawQuery}"`:'No hay diseños en esta categoría'}</h3>

        <button className="btn btn-primary" onClick={()=>{setCat('Todos');setRawQuery('');setQuery('');setOrient(null);}}><Icon n="grid" s={16}/>Ver todos los diseños</button>
      </div>
    )}

    {!loading && totalPages>1 && <div className="flex ic jc g2 fwrap" style={{marginTop:40}}>
      <button className="pg-btn" disabled={curPage<=1} onClick={()=>setPage(Math.max(1,curPage-1))}><Icon n="chevRight" s={16} style={{transform:'rotate(180deg)'}}/></button>
      {winStart>1 && <><button className={"pg-btn"+(curPage===1?" on":"")} onClick={()=>setPage(1)}>1</button><span className="muted" style={{padding:'0 4px'}}>…</span></>}
      {pageWindow.map(n=>(<button key={n} className={"pg-btn"+(curPage===n?" on":"")} onClick={()=>setPage(n)}>{n}</button>))}
      {winEnd<totalPages && <><span className="muted" style={{padding:'0 4px'}}>…</span><button className={"pg-btn"+(curPage===totalPages?" on":"")} onClick={()=>setPage(totalPages)}>{totalPages}</button></>}
      <button className="pg-btn" disabled={curPage>=totalPages} onClick={()=>setPage(Math.min(totalPages,curPage+1))}><Icon n="chevRight" s={16}/></button>
    </div>}

    {quick && <QuickView d={quick} onClose={()=>setQuick(null)}/>}
  </div>;
}

const FONTS = ['Inter','Playfair Display','Roboto Mono'];
const TEXT_COLORS = ['#FFFFFF','#11131A','#FF6B35','#F59E0B','#22C55E','#EF4444','#3B82F6','#A855F7','#EC4899','#14B8A6','#FACC15','#94A3B8'];

const MOTOR_URL = 'http://localhost:5000';

function UploadPanel({productLabel, onValidated, orient}){
  const [phase,setPhase]   = useState(ENABLE_AI_PROMPT ? 'prompt' : 'upload'); // prompt|upload
  const [state,setState]   = useState('idle'); // idle|drag|procesando|listo|error
  const [fileName,setFileName] = useState('');
  const [mockups,setMockups]   = useState([]);  // [{key,url}]
  const [motorOk,setMotorOk]   = useState(null); // null=no chequeado, true, false
  const inputRef = useRef();

  // Prompt Generator State
  const [idea,setIdea] = useState('');
  const [tipo,setTipo] = useState('');
  const [estilo,setEstilo] = useState('Realista');
  const [promptGen,setPromptGen] = useState('');
  const [copied,setCopied] = useState(false);


  // Verificar si el servidor está activo al montar
  useEffect(()=>{
    fetch(MOTOR_URL+'/health').then(r=>r.json()).then(()=>setMotorOk(true)).catch(()=>setMotorOk(false));
  },[]);

  const TIPOS = [
    {l:'🏞️ Paisaje', k:'paisaje', desc:'Montañas, océanos, naturaleza'},
    {l:'🖼️ Retrato', k:'retrato', desc:'Personas, expresiones, emociones'},
    {l:'🎭 Personaje', k:'personaje', desc:'Ficción, fantasía, aventura'},
    {l:'🌀 Abstracto', k:'abstracto', desc:'Formas, colores, composición'},
  ];
  const ESTILOS = [
    'Realista', 'Anime', 'Digital Art', 'Fotografía', 'Acuarela'
  ];

  const generarPrompt = () => {
    const tipoData = TIPOS.find(t=>t.k===tipo);
    const base = idea.trim() ? idea.trim() : (tipoData?.desc || 'hermosa escena');
    const tipoText = tipo ? 'de ' + tipoData.l.split(' ')[1].toLowerCase() : '';
    const estiloMap = {
      'Realista': 'fotorrealista, hiperdetallado, 8K, fotografía profesional',
      'Anime': 'estilo anime, cel shading, colores vibrantes, manga inspirado',
      'Digital Art': 'digital painting, concept art, artstation trending',
      'Fotografía': 'DSLR, bokeh, iluminación natural, fotografía ganadora',
      'Acuarela': 'acuarela, pinceladas suaves, paleta pastel',
    };
    const prompt = `${base}, ${estiloMap[estilo] || 'alta calidad'}, apto para arte de pared, cuadro enmarcado, impresión fotorrealista 4K, composición simétrica, detalles nítidos`;
    setPromptGen(prompt);
  };

  const copiarPrompt = () => {
    navigator.clipboard.writeText(promptGen);
    setCopied(true);
    setTimeout(()=>setCopied(false), 2000);
  };

  const procesarConMotor = async (file) => {
    setFileName(file.name); setState('procesando'); setMockups([]);
    const fd = new FormData();
    fd.append('imagen', file);
    fd.append('orient', orient || 'vertical');
    try {
      const res  = await fetch(MOTOR_URL+'/procesar-upload', {method:'POST', body:fd});
      const data = await res.json();
      if(data.ok && data.mockups && data.mockups.length){
        const urls = data.mockups.map(m=>({key:m.key, url:MOTOR_URL+m.url}));
        setMockups(urls); setState('listo');
        onValidated && onValidated(urls[0].url, urls);
      } else {
        setState('error');
      }
    } catch(e){
      setState('error');
    }
  };

  // Modo demo: subir sin procesar con Photoshop (motor offline)
  const subirSinProcesar = (file)=>{
    const url = URL.createObjectURL(file);
    setFileName(file.name);
    setMockups([{key:'comun',url}]);
    setState('listo');
    onValidated && onValidated(url, [{key:'comun',url}]);
  };

  const onPick = e=>{
    const f = e.target.files && e.target.files[0];
    if(f){ motorOk===false ? subirSinProcesar(f) : procesarConMotor(f); }
    e.target.value='';
  };

  return <div className="upl-split" style={{display:'flex',gap:0,height:'100%'}}>
    <input ref={inputRef} type="file" accept="image/png,image/jpeg" style={{display:'none'}} onChange={onPick}/>

    {/* CONTENT PANEL — ancho completo (panel conversacional eliminado) */}
    <div className="upl-right" style={{width:'100%',overflow:'auto',padding:'20px'}}>
    {/* FASE 1: PROMPT GENERATOR */}
    {phase==='prompt' && (
    <div>
      {/* Intro Premium — Glassmorphism con decoración */}
      <div style={{background:'linear-gradient(135deg,rgba(34,197,94,.1) 0%,rgba(27,42,74,.04) 100%)',backdropFilter:'blur(12px)',border:'1px solid rgba(34,197,94,.25)',borderRadius:16,padding:'20px 22px',marginBottom:24,boxShadow:'0 8px 32px rgba(0,0,0,.04), inset 0 1px 0 rgba(255,255,255,.8)',position:'relative',overflow:'hidden'}}>
        {/* Decoración de fondo sutil */}
        <div style={{position:'absolute',top:'-50%',right:'-30%',width:'300px',height:'300px',background:'radial-gradient(circle,rgba(34,197,94,.08) 0%,transparent 70%)',borderRadius:'50%',pointerEvents:'none'}}/>
        <div style={{position:'relative',display:'flex',alignItems:'flex-start',gap:14}}>
          <span style={{fontSize:28,lineHeight:1,flexShrink:0,filter:'drop-shadow(0 2px 8px rgba(34,197,94,.25))',animation:'bounce 3s ease-in-out infinite'}}>✨</span>
          <div style={{flex:1,minWidth:0}}>
            <p style={{fontSize:15,fontWeight:800,color:'var(--accent)',marginBottom:6,letterSpacing:'-0.02em'}}>Diseña con IA</p>
            <p style={{fontSize:13,color:'var(--text-3)',lineHeight:1.7,margin:0,fontWeight:400}}>Describe tu idea y genera un prompt optimizado para DALL·E, Midjourney o Stable Diffusion.</p>
          </div>
        </div>
      </div>

      {/* Input: Idea — Glassmorphism Premium */}
      <div style={{marginBottom:20}}>
        <label style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-3)',display:'block',marginBottom:10}}>Tu idea</label>
        <textarea value={idea} onChange={e=>setIdea(e.target.value)} placeholder="Ej: gato astronauta en la luna, mirando la tierra..."
          style={{width:'100%',padding:'14px 16px',border:'1px solid rgba(27,42,74,.12)',background:'linear-gradient(135deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.4) 100%)',backdropFilter:'blur(8px)',borderRadius:12,fontSize:13,fontWeight:400,color:'var(--text)',resize:'none',minHeight:90,fontFamily:'inherit',outline:'none',transition:'all .25s cubic-bezier(0.4,0,0.2,1)',boxShadow:'0 4px 16px rgba(0,0,0,.04), inset 0 1px 2px rgba(255,255,255,.6)',lineHeight:'1.6'}}
          onFocus={e=>{e.target.style.borderColor='rgba(34,197,94,.35)';e.target.style.boxShadow='0 0 0 4px rgba(34,197,94,.12), 0 4px 16px rgba(0,0,0,.04), inset 0 1px 2px rgba(255,255,255,.6)';}}

      {/* Separador decorativo */}
      <div style={{height:'1px',background:'linear-gradient(90deg,transparent 0%,rgba(34,197,94,.2) 50%,transparent 100%)',marginBottom:22}}/>

      <div style={{marginBottom:20}}>
        <label style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-3)',display:'block',marginBottom:12}}>🎯 Tipo de imagen</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {TIPOS.map(t=>(
            <button key={t.k} onClick={()=>setTipo(t.k)}
              style={{padding:'14px 12px',borderRadius:13,border:'1.5px solid '+(tipo===t.k?'rgba(34,197,94,.4)':'rgba(27,42,74,.08)'),background:tipo===t.k?'linear-gradient(135deg,rgba(34,197,94,.12) 0%,rgba(34,197,94,.06) 100%)':'linear-gradient(135deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.3) 100%)',backdropFilter:'blur(8px)',cursor:'pointer',fontSize:12,fontWeight:700,color:tipo===t.k?'var(--accent)':'var(--text)',transition:'all .25s cubic-bezier(0.4,0,0.2,1)',textAlign:'center',boxShadow:tipo===t.k?'0 8px 24px rgba(34,197,94,.15), inset 0 1px 0 rgba(255,255,255,.6)':'0 4px 12px rgba(0,0,0,.06), inset 0 1px 1px rgba(255,255,255,.7)'}}>
              {t.l}

          ))}
        </div>
      </div>

      {/* Estilo — Minimalismo Premium */}
      <div style={{marginBottom:22}}>
        <label style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-3)',display:'block',marginBottom:12}}>🎨 Estilo visual</label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {ESTILOS.map(e=>(
            <button key={e} onClick={()=>setEstilo(e)}
              style={{padding:'10px 18px',borderRadius:999,border:'1.5px solid '+(estilo===e?'rgba(34,197,94,.4)':'rgba(27,42,74,.1)'),background:estilo===e?'linear-gradient(135deg,var(--accent) 0%,rgba(34,197,94,.8) 100%)':'linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.3) 100%)',backdropFilter:'blur(8px)',color:estilo===e?'#fff':'var(--text)',cursor:'pointer',fontSize:12,fontWeight:700,transition:'all .25s cubic-bezier(0.4,0,0.2,1)',whiteSpace:'nowrap',boxShadow:estilo===e?'0 8px 20px rgba(34,197,94,.25), inset 0 1px 0 rgba(255,255,255,.3)':'0 2px 8px rgba(0,0,0,.04), inset 0 1px 1px rgba(255,255,255,.6)'}}>

        onMouseLeave={e=>{e.target.style.background='linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.3) 100%)';e.target.style.boxShadow='0 4px 16px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.7)';e.target.style.transform='translateY(0)';}}>

      {/* Prompt generado — Dark Glassmorphism Premium con decoración */}

      {/* Motor en mantenimiento — bloque elegante + modo demo */}
      {motorOk===false && state!=='listo' && state!=='procesando' && (
        <div style={{background:'linear-gradient(135deg,rgba(245,158,11,.10),rgba(27,42,74,.05))',border:'1px solid rgba(245,158,11,.35)',borderRadius:14,padding:'22px 20px',textAlign:'center'}}>

          </button>
          <p className="cap muted" style={{marginTop:12}}>PNG (recomendado) o JPG en alta calidad · máx. 20 MB · vista previa sin mockups HD</p>
        </div>
      )}

      {/* Dropzone normal — solo cuando el motor está disponible o aún se verifica */}
      {motorOk!==false && state!=='procesando' && state!=='listo' && (
      <div className={"ed-drop"+(state==='drag'?' drag':'')}
        onDragOver={e=>{e.preventDefault();setState('drag');}}
        onDragLeave={()=>setState(s=>s==='drag'?'idle':s)}
        onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)procesarConMotor(f);}}
        onClick={()=>inputRef.current&&inputRef.current.click()}>
        <div className="ed-drop-ic"><Icon n="upload" s={34}/></div>
        <p style={{fontWeight:800,fontSize:17,marginBottom:4}}>{state==='drag'?'¡Suéltala aquí!':'Arrastra tu imagen aquí'}</p>
        <p className="muted" style={{fontSize:13,marginBottom:18}}>o selecciona desde tu galería</p>
        <button className="btn btn-outline" onClick={e=>{e.stopPropagation();inputRef.current&&inputRef.current.click();}}>
          <Icon n="image" s={16}/>Seleccionar imagen
        </button>
        <p className="cap muted" style={{marginTop:16}}>PNG (recomendado) o JPG en alta calidad · máx. 20 MB</p>
      </div>
      )}
    </div>
    )}

    {/* Estado: procesando */}
    {state==='procesando' && (
      <div style={{padding:'48px 20px',background:'var(--surface)',borderRadius:18,
        border:'1px solid var(--line)',textAlign:'center'}}>
        <span className="spin" style={{display:'block',width:40,height:40,margin:'0 auto 18px'}}/>
        <p style={{fontWeight:800,fontSize:16,marginBottom:6}}>Tu cuadro se está creando...</p>
        <p className="cap muted">{fileName}</p>
      </div>
    )}

    {/* Estado: listo — mostrar mockups generados */}
    {state==='listo' && mockups.length>0 && (
      <div>
        <div className="flex ic jb" style={{marginBottom:14}}>
          <p style={{fontWeight:800,fontSize:15}}>Tus mockups</p>
          <span className="pill pill-success" style={{fontWeight:700}}>Listo ✓</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
          {mockups.map((m,i)=>(
            <button key={m.key} className="ed-card"
              onClick={()=>onValidated&&onValidated(m.url, mockups)}>
              <img src={m.url} alt={m.key}/>
            </button>
          ))}
        </div>
        <button className="btn btn-ghost-line btn-block" style={{marginTop:14}}
          onClick={()=>{setState('idle');setMockups([]);}}>
          <Icon n="upload" s={15}/>Subir otra imagen
        </button>
      </div>
    )}

    {/* Estado: error */}
    {state==='error' && (
      <div style={{marginTop:16,padding:'16px',background:'rgba(192,57,43,.06)',
        border:'1px solid rgba(192,57,43,.25)',borderRadius:10}}>
        <p style={{fontWeight:600,color:'var(--error)',marginBottom:8}}>No se pudo procesar la imagen</p>
        <p className="small muted" style={{marginBottom:12}}>Verifica que el motor esté activo y que la imagen sea válida.</p>
        <button className="btn btn-outline btn-sm" onClick={()=>{setState('idle');setMockups([]);}}>
          Intentar de nuevo
        </button>
      </div>
    )}
    </div>
  </div>;
}

/* ============================================================
   COMPOSITE PREVIEW (canvas 2D · imagen del cliente sobre mockup)
============================================================ */
// Coordenadas del área del cuadro (normalizado 0-1) dentro del mockup.
// Calibrar tras ver el resultado visual sobre los mockups reales.
function CompositePreview({imageSrc, orient, zoom=1, rot=0}){
  // Frame CSS que simula lienzo real — sin canvas 2D, sin problemas de CORS
  const isV = orient === 'vertical';
  const aspect = isV ? '3/4' : '4/3';
  const edgeSize = 18; // px — grosor del borde canvas lateral

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',gap:20,padding:'32px 24px'}}>

      {/* Marco canvas con perspectiva lateral */}
      <div style={{
        transform:`scale(${zoom}) rotate(${rot}deg)`,
        transition:'transform .25s var(--ease)',
        width: isV ? 280 : 400,
        maxWidth:'90%',
        position:'relative',
      }}>
        {/* Cara frontal — la imagen */}
        <div style={{
          aspectRatio: aspect,
          overflow:'hidden',
          borderRadius:3,
          boxShadow:`
            0 2px 0 rgba(0,0,0,.15),
            ${edgeSize}px ${edgeSize}px 0 rgba(0,0,0,.08),
            0 40px 80px rgba(0,0,0,.25),
            0 8px 24px rgba(0,0,0,.12)
          `,
          position:'relative',
          zIndex:2,
        }}>
          <img src={imageSrc} alt="Tu diseño"
            style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
          {/* Vignette sutil para dar profundidad */}
          <div style={{position:'absolute',inset:0,
            background:'radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.15) 100%)',
            pointerEvents:'none'}}/>
        </div>

        {/* Borde lateral derecho — simula grosor del canvas */}
        <div style={{
          position:'absolute',
          top: edgeSize, right: -edgeSize,
          bottom: -edgeSize,
          width: edgeSize,
          background:'linear-gradient(to right, rgba(0,0,0,.18), rgba(0,0,0,.08))',
          borderRadius:'0 3px 3px 0',
          zIndex:1,
          transformOrigin:'left center',
          skewY: '0deg',
        }}/>

        {/* Borde inferior — simula grosor del canvas */}
        <div style={{
          position:'absolute',
          bottom: -edgeSize, left: edgeSize,
          right: -edgeSize,
          height: edgeSize,
          background:'linear-gradient(to bottom, rgba(0,0,0,.22), rgba(0,0,0,.08))',
          borderRadius:'0 0 3px 0',
          zIndex:1,
        }}/>
      </div>

      {/* Info del tamaño */}
      <div style={{textAlign:'center'}}>
        <p style={{fontSize:13,color:'var(--text-2)',fontWeight:500,marginBottom:4}}>
          {isV ? '50×70 cm o 30×40 cm' : '70×50 cm o 40×30 cm'} · Lienzo premium
        </p>
        <p style={{fontSize:11,color:'var(--text-3)'}}>
          Vista previa aproximada · El producto final puede variar levemente
        </p>
      </div>
    </div>
  );
}

   MOCKUP PREVIEW (mockups reales del catálogo o compositor)
============================================================ */
function MockupPreview({design, orient, zoom=1, rot=0, active=0}){
  const mockups = design && design.mock ? [
    design.mock.comun && {src: design.mock.comun, label:'Ambiente 1'},
    design.mock.a     && {src: design.mock.a,     label:'Ambiente 2'},
    design.mock.b     && {src: design.mock.b,     label:'Ambiente 3'},
  ].filter(Boolean) : [];

  if(!design){
    return (
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
        flexDirection:'column',gap:0,padding:'40px 24px',
        background:'linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%)'}}>
        <div style={{width:88,height:88,borderRadius:'50%',background:'var(--accent-soft)',
          display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}>
          <Icon n="image" s={38} c="var(--accent)"/>
        </div>
        <p style={{fontSize:14,fontWeight:700,color:'var(--text-2)',margin:0}}>Elige un diseño o sube tu imagen</p>

      </div>
    );
  }

  const cur = mockups[active] || mockups[0];
  return (
    <div style={{
      position:'absolute', inset:0,
      display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center',
      gap:10, padding:'16px', overflow:'hidden',
      background:'#f0ede8', // fallback
    }}>

      {/* Ambient background — imagen difuminada que camufla el mockup */}
      <div style={{
        position:'absolute', inset:-40,
        backgroundImage:`url(${cur.src})`,
        backgroundSize:'cover',
        backgroundPosition:'center',
        filter:'blur(32px) saturate(1.2)',
        transform:'scale(1.15)',
        opacity:.55,
        zIndex:0,
        transition:'background-image .4s',
      }}/>
      {/* Overlay para suavizar los bordes */}
      <div style={{
        position:'absolute', inset:0, zIndex:1,
        background:'linear-gradient(to bottom, rgba(255,255,255,.18) 0%, rgba(255,255,255,.05) 50%, rgba(255,255,255,.18) 100%)',
      }}/>

      {/* Imagen — flota directamente sobre el ambient sin carta blanca */}
      <div style={{
        flex:1, minHeight:0, width:'100%', zIndex:2,
        display:'flex', alignItems:'center', justifyContent:'center',
        overflow:'hidden', background:'transparent',
      }}>
        <img
          src={cur.src}
          alt={design.name}
          loading="lazy"
          style={{
            maxWidth:'90%',
            maxHeight:'90%',
            width:'auto',
            height:'auto',
            objectFit:'contain',
            display:'block',
            borderRadius:8,
            boxShadow:'0 32px 80px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.3)',
            transform:`scale(${zoom}) rotate(${rot}deg)`,
            transition:'transform .25s var(--ease)',
          }}
        />
      </div>

      {/* Thumbnails pegados a la imagen, sin espacio muerto */}
      {/* thumbnails manejados desde el overlay del Editor */}
    </div>
  );
}

                          transition:'transform .25s, box-shadow .25s',}}
                        onMouseEnter={e=>{e.currentTarget.style.transform='scale(1.025)';e.currentTarget.style.boxShadow='0 12px 32px rgba(0,0,0,.2)';}}
                        onMouseLeave={e=>{e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow='none';}}>

                        {/* Fondo blur para panorámicos, cover para cuadrados */}
                        {rep && (tall ? <>
                          {/* Blur de fondo */}
                          <div style={{position:'absolute',inset:-20,
                            backgroundImage:`url(${rep.mock.comun})`,
                            backgroundSize:'cover',backgroundPosition:'center',
                            filter:'blur(18px) brightness(.5) saturate(.8)',
                            transform:'scale(1.1)'}}/>
                          {/* Imagen contenida a la derecha */}
                          <img src={rep.mock.comun} alt={m.l}
                            style={{position:'absolute',right:0,top:'50%',
                              transform:'translateY(-50%)',
                              height:'115%',width:'auto',
                              objectFit:'contain',opacity:.9}}/>
                        </> : (
                          <img src={rep.mock.comun} alt={m.l}
                            style={{position:'absolute',inset:0,width:'100%',height:'100%',
                              objectFit:'cover',objectPosition:'center'}}/>
                        ))}

                        {/* Overlay de texto */}
                        <div style={{position:'absolute',inset:0,
                          background: tall
                            ? 'linear-gradient(to right,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 55%,transparent 80%)'
                            : 'linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.05) 60%)'
                        }}/>

                        {/* Texto */}
                        <div style={{position:'absolute',inset:0,padding: tall?'16px 18px':'10px',
                          display:'flex',
                          flexDirection: tall?'row':'column',
                          alignItems: tall?'center':'flex-end',
                          justifyContent:'flex-start',
                          gap: tall?12:0,
                        }}>
                          {tall ? <>
                            <span style={{fontSize:26,lineHeight:1,flexShrink:0}}>{m.e}</span>
                            <div>
                              <p style={{fontSize:15,fontWeight:900,color:'#fff',
                                letterSpacing:'-.01em',marginBottom:3}}>{m.l}</p>
                              <p style={{fontSize:11,color:'rgba(255,255,255,.5)'}}>{count} diseños</p>
                            </div>
                          </> : <>
                            <span style={{fontSize:18,lineHeight:1,marginBottom:5,display:'block'}}>{m.e}</span>
                            <p style={{fontSize:11,fontWeight:800,color:'#fff',lineHeight:1.2}}>{m.l}</p>
                            <p style={{fontSize:10,color:'rgba(255,255,255,.45)',marginTop:2}}>{count}</p>
                          </>}
                        </div>
                      </button>
                    );
                  };

                  return <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {/* Tile grande */}
                    <Tile c={featured} tall={true}/>
                    {/* Grid 2x2 para los 4 siguientes */}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                      {rest.slice(0,4).map(c=><Tile key={c} c={c} tall={false}/>)}
                    </div>
                    {/* Último si hay más de 5 */}
                    {rest[4] && <Tile c={rest[4]} tall={true}/>}
                  </div>;
                })()}
              </div>

            ) : (
              /* Vista de categoría o búsqueda */
              <div>
                {/* Header de navegación */}
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                  <button onClick={()=>{setCat('Todos');setQuery('');}}
                    style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',
                      borderRadius:8,background:'var(--bg)',border:'1px solid var(--line)',
                      fontSize:12,fontWeight:600,color:'var(--text-2)',cursor:'pointer',
                      transition:'border-color .15s'}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                    onMouseLeave={e=>e.currentTarget.style.borderColor='var(--line)'}>
                    <Icon n="arrowL" s={13}/>Volver
                  </button>
                  {cat!=='Todos' && (
                    <div style={{display:'flex',alignItems:'center',gap:6,flex:1,minWidth:0}}>
                      <span style={{fontSize:16}}>{CAT_META[cat]?.e}</span>
                      <span style={{fontSize:13,fontWeight:700,color:'var(--text)',
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {CAT_META[cat]?.l||cat}
                      </span>
                    </div>
                  )}
                  {query && <span style={{fontSize:11,color:'var(--text-3)',flex:1}}>"{query}"</span>}
                  <span style={{fontSize:11,color:'var(--text-3)',flexShrink:0}}>{shown.length}</span>
                </div>

                {/* Buscador */}
                <div className="ed-search" style={{marginBottom:14}}>
                  <span className="ic"><Icon n="search" s={16}/></span>
                  <input value={query} onChange={e=>setQuery(e.target.value)}
                    placeholder={cat!=='Todos'?`Buscar en ${CAT_META[cat]?.l||cat}...`:'Buscar diseño...'}/>
                </div>

                {/* Grid 3 columnas */}
                {shown.length>0 ? (
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7}}>
                    {shown.map(d=>{
                      const on = design && design.id===d.id;
                      return (
                        <button key={d.id}
                          onClick={()=>{setDesign(d);setUploadedFile(null);setActiveMock(0);
                            setOrient(d.orient||orient);setSize((d.orient||orient)==='vertical'?'50x70':'70x50');}}
                          style={{position:'relative',aspectRatio:'1',borderRadius:8,overflow:'hidden',
                            padding:0,cursor:'pointer',
                            outline: on?'2.5px solid var(--accent)':'none',
                            outlineOffset:on?'2px':'0',
                            transition:'outline .15s, transform .2s',}}
                          onMouseEnter={e=>{if(!on)e.currentTarget.style.transform='scale(1.05)';}}
                          onMouseLeave={e=>e.currentTarget.style.transform='none'}>
                          <img src={(d.mock&&d.mock.comun)||IMG(d.seed,200,200)} alt={d.name}
                            loading="lazy" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                          {on && <span className="ed-check"><Icon n="check" s={11} sw={3} c="#fff"/></span>}
                        </button>
                      );
                    })}
                  </div>
                ) : (
                  <div style={{padding:'32px 0',textAlign:'center'}}>
                    <p style={{fontSize:13,color:'var(--text-3)'}}>Sin resultados para "{query}"</p>
                    <button onClick={()=>setQuery('')}
                      style={{marginTop:10,fontSize:12,color:'var(--accent)',background:'none',
                        border:'none',cursor:'pointer',fontWeight:600}}>Limpiar búsqueda</button>
                  </div>
                )}

                {/* Diseño seleccionado */}
                {selDesign && (
                  <div style={{marginTop:14,padding:'10px 12px',borderRadius:10,
                    background:'var(--accent-soft)',border:'1.5px solid var(--accent)',
                    display:'flex',alignItems:'center',gap:10}}>
                    <img src={selDesign.mock?.comun} alt=""
                      style={{width:34,height:34,borderRadius:6,objectFit:'cover',flexShrink:0}}/>
                    <div style={{minWidth:0,flex:1}}>
                      <p style={{fontSize:12,fontWeight:800,color:'var(--accent)',
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selDesign.name}</p>
                      <p style={{fontSize:11,color:'var(--text-3)'}}>{selDesign.cat}</p>
                    </div>
                    <Icon n="check" s={15} c="var(--accent)"/>
                  </div>
                )}
              </div>
            )}
          </>}
          {tab==='subir' && <UploadPanel productLabel={variantLabel} orient={orient}
            onValidated={(primaryUrl, allMockups)=>{
              // Construir diseño virtual con las URLs del motor
              const keys = allMockups || [{key:'comun', url:primaryUrl}];
              const mock = {};
              keys.forEach((m,i)=>{ mock[i===0?'comun':i===1?'a':'b'] = m.url; });
              setUploadedFile({
                id: 'upload_'+Date.now(),
                name: 'Tu diseño',
                n: 'Tu diseño',
                cat: 'Mi diseño',
                c: 'Mi diseño',
                orient,
                mock,
              });
              setDesign(null);
            }}/>}
          {tab==='texto' && <TextPanel/>}
        </div>
      </div>

      {/* RIGHT PANEL */}
      <div style={{background:'var(--bg)',display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>

        {/* Selector tamaño — orientación fijada por el diseño */}
        <div style={{flexShrink:0,padding:'12px 20px',borderBottom:'1px solid var(--line)',background:'var(--surface)'}}>
          <div style={{display:'flex',gap:16,alignItems:'flex-start'}}>
            {/* Orientación — solo informativa, fijada por el diseño */}
            <div style={{flex:'none'}}>
              <p style={{fontSize:10,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',
                color:'var(--text-3)',marginBottom:8}}>Orientación</p>
              <div style={{display:'inline-flex',alignItems:'center',gap:8,padding:'8px 14px',
                borderRadius:10,background:'var(--accent-soft)',border:'2px solid var(--accent)'}}>
                <span style={{
                  display:'inline-block',
                  width: orient==='vertical'?18:26,
                  height: orient==='vertical'?26:18,
                  border:'2.5px solid var(--accent)',borderRadius:3,
                }}/>
                <span style={{fontSize:12,fontWeight:700,color:'var(--accent)',textTransform:'capitalize'}}>{orient}</span>
              </div>
            </div>
            <div style={{width:1,background:'var(--line-2)',alignSelf:'stretch'}}/>
            {/* Tamaño */}
            <div style={{flex:1}}>
              <p style={{fontSize:10,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',
                color:'var(--text-3)',marginBottom:8}}>Tamaño</p>
              <div style={{display:'flex',gap:8}}>
                {sizeOptions.map(s=>(
                  <button key={s.v} onClick={()=>setSize(s.v)} className={"ed-size"+(size===s.v?' on':'')}>
                    <span className="num">{s.label.replace(' cm','')}</span>
                    <p className="pr">{CLP(s.price)}</p>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* MockupPreview + info overlay integrado */}
        <div className="ed-preview-container" style={{flex:1,minHeight:0,position:'relative',overflow:'hidden'}}>
          <MockupPreview design={activeDesign} orient={orient} zoom={zoom} rot={rot} active={activeMock}/>

          {/* Controles zoom — top right */}
          <div className="canvas-ctrl">
            {ctrl.map(([ic,label,fn])=>(
              <button key={label} className="cc-btn tip" onClick={fn}>
                <Icon n={ic} s={18}/><span className="tip-c">{label}</span>
              </button>
            ))}
          </div>

          {/* Info overlay — nombre elegante izquierda, precio+botón derecha */}
          <div className="ed-preview-bar" style={{
            position:'absolute', bottom:0, left:0, right:0, zIndex:10,
            padding:'48px 24px 20px',
            background:'linear-gradient(to top, rgba(0,0,0,.52) 0%, rgba(0,0,0,.2) 60%, transparent 100%)',
            display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:16,
          }}>
            {/* Nombre elegante + selectores de mockup */}
            <div style={{minWidth:0,flex:1}}>
              {activeDesign && <>
                <p style={{fontSize:11,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',
                  color:'rgba(255,255,255,.6)',marginBottom:4}}>
                  {activeDesign.cat}
                </p>
                <p className="ed-preview-name" style={{fontSize:20,fontWeight:800,color:'#fff',lineHeight:1.2,
                  letterSpacing:'-.01em',marginBottom:12,
                  overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:260}}>
                  {activeDesign.name||activeDesign.n||'Tu diseño'}
                </p>
                {/* Selectores de ambiente */}
                {activeDesign.mock && (
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    {[activeDesign.mock.comun,activeDesign.mock.a,activeDesign.mock.b]
                      .filter(Boolean)
                      .map((src,i)=>(
                      <button key={i} onClick={()=>setActiveMock(i)}
                        style={{
                          width:44,height:44,borderRadius:8,overflow:'hidden',padding:0,cursor:'pointer',
                          border: activeMock===i?'2.5px solid #fff':'2.5px solid rgba(255,255,255,.25)',
                          opacity: activeMock===i?1:.6,
                          transition:'all .18s',
                          boxShadow: activeMock===i?'0 0 0 3px rgba(255,255,255,.2)':'none',
                          flexShrink:0,
                        }}>
                        <img src={src} alt={`Ambiente ${i+1}`}
                          style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                      </button>
                    ))}
                    <span style={{fontSize:11,color:'rgba(255,255,255,.45)',marginLeft:4}}>
                      Ambiente {activeMock+1}
                    </span>
                  </div>
                )}
              </>}
              {!activeDesign && (
                <p style={{fontSize:14,color:'rgba(255,255,255,.5)',fontStyle:'italic'}}>
                  Elige un diseño para continuar
                </p>
              )}
            </div>

            {/* Precio + botón derecha */}
            <div className="ed-preview-cta" style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:10,flexShrink:0}}>
              {activeDesign && (
                <div style={{textAlign:'right'}}>
                  <p style={{fontSize:11,color:'rgba(255,255,255,.55)',marginBottom:2}}>Total</p>
                  <p style={{fontSize:26,fontWeight:900,color:'#fff',letterSpacing:'-.02em',lineHeight:1}}>
                    {CLP(sizePrice)}
                  </p>
                </div>
              )}
              <button
                disabled={!ready}
                onClick={()=>{if(ready) handleAddToCart();}}
                style={{
                  background: ready ? '#fff' : 'rgba(255,255,255,.2)',
                  color: ready ? 'var(--accent)' : 'rgba(255,255,255,.5)',
                  border:'none', padding:'12px 22px',
                  borderRadius:10, fontSize:14, fontWeight:800,
                  cursor: ready?'pointer':'not-allowed',
                  display:'flex', alignItems:'center', gap:8,
                  boxShadow: ready?'0 4px 20px rgba(0,0,0,.35)':'none',
                  transition:'transform .15s, box-shadow .15s',
                  whiteSpace:'nowrap',
                }}
                onMouseEnter={e=>{ if(ready){e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 8px 28px rgba(0,0,0,.4)'; }}}
                onMouseLeave={e=>{ e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow=ready?'0 4px 20px rgba(0,0,0,.35)':'none'; }}>
                <Icon n="cart" s={16}/>
                {ready ? 'Agregar al carrito' : 'Elige un diseño'}
              </button>
            </div>
          </div>
        </div>

        {/* ── Mobile info panel — visible solo en ≤900px ── */}
        <div className="ed-mob-info">
          {/* Fila superior: nombre + selectores de ambiente */}
          <div className="ed-mob-head">
            <div style={{flex:1,minWidth:0}}>
              {activeDesign ? <>
                <p style={{fontSize:10,fontWeight:700,letterSpacing:'.1em',
                  textTransform:'uppercase',color:'var(--accent)',marginBottom:3}}>
                  {activeDesign.cat}
                </p>
                <p style={{fontSize:17,fontWeight:800,color:'var(--text)',marginBottom:10,
                  overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {activeDesign.name||activeDesign.n||'Tu diseño'}
                </p>
                {activeDesign.mock && (
                  <div style={{display:'flex',gap:7,alignItems:'center'}}>
                    {[activeDesign.mock.comun,activeDesign.mock.a,activeDesign.mock.b]
                      .filter(Boolean).map((src,i)=>(
                      <button key={i} onClick={()=>setActiveMock(i)}
                        className={"ed-amb-thumb"+(activeMock===i?' on':'')}>
                        <img src={src} alt={'Ambiente '+(i+1)}/>
                      </button>
                    ))}
                    <span style={{fontSize:11,color:'var(--text-3)',marginLeft:2}}>
                      Ambiente {activeMock+1}
                    </span>
                  </div>
                )}
              </> : (
                <p style={{fontSize:13,color:'var(--text-3)',fontStyle:'italic'}}>
                  Elige un diseño en el panel de arriba
                </p>
              )}
            </div>
          </div>
          {/* Fila inferior: precio grande + botón prominente */}
          <div className="ed-mob-foot">
            <div className="ed-mob-price">
              <p className="lbl">{activeDesign?'Total':'Desde'}</p>
              <p className="val">{CLP(sizePrice)}</p>
            </div>
            <button
              disabled={!ready}
              onClick={()=>{if(ready)handleAddToCart();}}
              className={"btn ed-mob-btn "+(ready?'btn-primary':'btn-disabled')}>
              <Icon n="cart" s={17}/>{ready?'Agregar al carrito':'Elige un diseño'}
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>;
}

/* ============================================================
   VIEW: CART
============================================================ */
function QtyCtrl({qty,onChange}){
  return <div className="flex ic" style={{border:'1px solid var(--line-2)',borderRadius:8,overflow:'hidden'}}>
    <button className="qty-b" onClick={()=>onChange(Math.max(1,qty-1))} disabled={qty<=1}><Icon n="minus" s={15}/></button>
    <span style={{minWidth:34,textAlign:'center',fontWeight:600,fontSize:14}}>{qty}</span>
    <button className="qty-b" onClick={()=>onChange(qty+1)}><Icon n="plus" s={15}/></button>
  </div>;
}
function Cart(){
  const {navigate,cartItems,updateCartQty,removeFromCart,addToast,discount:storeDiscount,setDiscount} = useStore();
  const [code,setCode]=useState('');
  const applied = storeDiscount && storeDiscount.code;
  const subtotal=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const discount=applied?storeDiscount.amount:0;
  const total=Math.max(0,subtotal-discount);
  const applyCode = ()=>{
    const c = code.trim().toUpperCase();
    if(!c) return;
    if(DISCOUNT_CODES[c]!==undefined){
      setDiscount({code:c, amount:DISCOUNT_CODES[c]});
      addToast('Código aplicado · −'+CLP(DISCOUNT_CODES[c]));
    } else {
      addToast('Código no válido','error');
    }
  };
  const freeAt=50000;
  const pct=Math.min(100,Math.round(subtotal/freeAt*100));

  if(!cartItems.length) return <div className="page wrap" style={{paddingTop:96,paddingBottom:80,minHeight:'70vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div className="tc" style={{maxWidth:480}}>
      <div style={{width:96,height:96,borderRadius:'50%',background:'var(--accent-soft)',
        display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}>
        <Icon n="cart" s={40} c="var(--accent)"/>
      </div>
      <h2 className="h2" style={{marginBottom:12,color:'var(--accent)'}}>Tu carrito está vacío</h2>
      <p className="muted" style={{marginBottom:10,lineHeight:1.6}}>Pero no te preocupes: hay <strong style={{color:'var(--accent)',fontWeight:700}}>2.129 diseños increíbles</strong> esperando por ti.</p>
      <p className="small" style={{color:'var(--text-3)',marginBottom:28}}>✨ Elige uno del catálogo o sube tu propia foto</p>
      <button className="btn btn-primary btn-lg" onClick={()=>navigate('gallery')}><Icon n="grid" s={17}/>Explorar diseños</button>
    </div>
  </div>;

  return <div className="page wrap mob-cta-pad" style={{paddingTop:96,paddingBottom:70,minHeight:'70vh'}}>
    <Breadcrumbs items={[{label:'Inicio',to:'home'},{label:'Carrito'}]}/>
    <div className="flex ie jb fwrap g3" style={{marginBottom:28}}>
      <h1 className="h1">Tu carrito</h1><span className="muted">{cartItems.length} {cartItems.length===1?'artículo':'artículos'}</span>
    </div>
    <div className="cart-layout">
      <div className="flex col g3">
        {cartItems.map(it=>(
          <div key={it.id} className="card" style={{padding:16,display:'flex',gap:16,alignItems:'flex-start'}}>
            <img src={it.mockup||IMG(it.seed,200,200)} alt={it.design} style={{width:84,height:84,borderRadius:10,objectFit:'cover',flex:'none'}}/>
            <div className="fx" style={{minWidth:0}}>
              <div className="flex jb g2" style={{marginBottom:4}}>
                <p style={{fontWeight:700}}>{it.product}</p>
                <button className="icon-btn tip" style={{width:32,height:32,flex:'none'}} onClick={()=>removeFromCart(it.id,it.design)}>
                  <Icon n="trash" s={16}/><span className="tip-c">Eliminar</span></button>
              </div>
              <p className="small muted" style={{marginBottom:3}}>Diseño: {it.design}</p>
              <p className="cap muted" style={{marginBottom:14}}>{it.variant}</p>
              <div className="flex ic jb fwrap g2">
                <QtyCtrl qty={it.qty} onChange={q=>updateCartQty(it.id,q)}/>
                <span style={{fontWeight:700,fontSize:16}}>{CLP(it.price*it.qty)}</span>
              </div>
            </div>
          </div>
        ))}
        <button className="btn btn-ghost-line" style={{alignSelf:'flex-start'}} onClick={()=>navigate('gallery')}>
          <Icon n="arrowL" s={16}/>Seguir comprando</button>
      </div>

      <div className="card" style={{padding:24,position:'sticky',top:84}}>
        <h3 className="h3" style={{marginBottom:20}}>Resumen</h3>
        <div className="flex jb small" style={{marginBottom:12}}><span className="muted">Subtotal</span><span style={{fontWeight:600}}>{CLP(subtotal)}</span></div>
        <div className="flex jb small" style={{marginBottom:12}}><span className="muted">Envío</span><span className="muted">Se calcula en checkout</span></div>
        {applied && <div className="flex jb small" style={{marginBottom:12,color:'var(--success)'}}><span>Descuento ({storeDiscount.code})</span><span style={{fontWeight:600}}>−{CLP(discount)}</span></div>}

        <div style={{margin:'16px 0'}}>
          <div className="flex g2">
            <input className="input" value={code} onChange={e=>setCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&applyCode()} placeholder="Código de descuento" style={{padding:'11px 14px'}} disabled={applied}/>
            <button className="btn btn-outline" style={{flex:'none'}} disabled={applied} onClick={applyCode}>Aplicar</button>
          </div>
          {applied && <div className="flex ic jb" style={{marginTop:8}}>
            <p className="cap" style={{color:'var(--success)'}}><Icon n="check" s={12} style={{display:'inline',verticalAlign:'-2px',marginRight:4}}/>Código {storeDiscount.code} aplicado</p>
            <button className="cap pointer" style={{color:'var(--error)',fontWeight:600,background:'none',border:'none'}}
              onClick={()=>{setDiscount(null);setCode('');addToast('Código removido','error');}}>Quitar</button>
          </div>}
        </div>

        <div className="divider" style={{margin:'16px 0'}}/>
        <div className="flex jb" style={{marginBottom:18}}><span style={{fontWeight:700,fontSize:17}}>Total</span><span style={{fontWeight:800,fontSize:22}}>{CLP(total)}</span></div>
        <button className="btn btn-primary btn-block btn-xl" style={{marginBottom:16}} onClick={()=>navigate('checkout')}>Ir a checkout<Icon n="arrowR" s={18}/></button>

        <div className="surface-2" style={{borderRadius:10,padding:'12px 14px'}}>
          <div className="flex ic jb cap" style={{marginBottom:7}}>
            <span className="flex ic g2"><Icon n="truck" s={14} c={pct>=100?'var(--success)':'var(--accent)'}/>{pct>=100?'¡Tienes envío gratis!':`Te faltan ${CLP(freeAt-subtotal)} para envío gratis`}</span>
          </div>

// Validaciones básicas
const isValidEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||'').trim());
const isValidRut = r => {
  const clean = (r||'').replace(/[.\-\s]/g,'').toUpperCase();
  if(clean.length<2) return false;
  const body = clean.slice(0,-1), dv = clean.slice(-1);
  if(!/^\d+$/.test(body)) return false;
  let sum=0, mul=2;
  for(let i=body.length-1;i>=0;i--){ sum+=parseInt(body[i],10)*mul; mul=mul===7?2:mul+1; }
  const res=11-(sum%11);
  const calc=res===11?'0':res===10?'K':String(res);
  return calc===dv;
};
const isValidPhone = p => (p||'').replace(/[^\d]/g,'').length>=8;

function Checkout(){
  const {navigate,cartItems,discount,setCustomer,setLastOrder,clearCart,addToast} = useStore();
  const [ship,setShip]=useState('starken');
  const [region,setRegion]=useState('');
  const [f,setF]=useState({email:'',rut:'',nombre:'',apellido:'',dir:'',depto:'',ciudad:'',cp:'',tel:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const [errors,setErrors]=useState({});

  // Pago (Webpay mock)
  const [payOpen,setPayOpen]=useState(false);
  const [payStage,setPayStage]=useState('form'); // form|processing|success
  const [card,setCard]=useState({num:'',exp:'',cvv:'',name:''});
  const setC=(k,v)=>setCard(p=>({...p,[k]:v}));
  const [cardErr,setCardErr]=useState({});

  const subtotal=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const disc=discount?discount.amount:0;
  const shipCost=SHIP.find(s=>s.id===ship)?.p||0;
  const total=Math.max(0,subtotal+shipCost-disc);

  if(!cartItems.length) return <div className="page wrap" style={{paddingTop:110,paddingBottom:80,minHeight:'70vh',display:'flex',alignItems:'center',justifyContent:'center'}}>

      <h2 className="h2" style={{marginBottom:12}}>Tu carrito está vacío</h2>
      <p className="muted" style={{marginBottom:26}}>Agrega un diseño antes de continuar al checkout.</p>

    </div>
  </div>;

  // NOTA: se invoca como función pura {F({...})} y NO como componente <F/>.
  // Definir un componente dentro del render y usarlo como <F/> hace que React
  // lo trate como un tipo nuevo en cada keystroke → desmonta el <input/> y se
  // pierde el foco tras cada carácter. Llamarlo como función evita el remount.
  const F=({label,ph,type='text',span,k,req,mode,ac})=>(
    <div key={k} style={span?{gridColumn:'1 / -1'}:{}}>
      <label className="field-label">{label}{req && <span style={{color:'var(--error)'}}> *</span>}</label>
      <input className="input" type={type} placeholder={ph} value={f[k]||''}
        onChange={e=>set(k,e.target.value)}
        aria-label={label}
        inputMode={mode}
        autoComplete={ac||'off'}
        style={errors[k]?{borderColor:'var(--error)'}:{}}/>
      {errors[k] && <p className="cap" style={{color:'var(--error)',marginTop:4}}>{errors[k]}</p>}
    </div>
  );

  const validate=()=>{
    const e={};
    if(!isValidEmail(f.email)) e.email='Email no válido';
    if(!isValidRut(f.rut)) e.rut='RUT no válido (ej: 12.345.678-5)';
    if(!f.nombre.trim()) e.nombre='Requerido';
    if(!f.apellido.trim()) e.apellido='Requerido';
    if(!f.dir.trim()) e.dir='Requerido';
    if(!f.ciudad.trim()) e.ciudad='Requerido';
    if(!region) e.region='Selecciona región';
    if(!isValidPhone(f.tel)) e.tel='Teléfono no válido';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const goToPay=()=>{
    if(!validate()){ addToast('Revisa los campos marcados','error'); return; }
    setCustomer({...f, region, ship});
    setPayStage('form'); setPayOpen(true);
  };

  // Webpay mock: validar presencia de datos de tarjeta, procesar, éxito
  const submitPayment=()=>{
    const ce={};
    if(card.num.replace(/\s/g,'').length<13) ce.num='Número incompleto';
    if(!/^\d{2}\/\d{2}$/.test(card.exp.trim())) ce.exp='MM/AA';
    if(card.cvv.replace(/\D/g,'').length<3) ce.cvv='CVV';
    if(!card.name.trim()) ce.name='Requerido';
    setCardErr(ce);
    if(Object.keys(ce).length) return;
    setPayStage('processing');
    setTimeout(()=>{
      setPayStage('success');
      setTimeout(()=>{
        // Registrar pedido confirmado y limpiar carrito
        const order={
          id:'TH-'+Math.floor(2848+Math.random()*900),
          items:cartItems,
          subtotal, discount:disc, discountCode:discount?discount.code:null,
          shipCost, shipName:SHIP.find(s=>s.id===ship)?.n||'Starken', total,
          customer:{...f,region,ship},
          fecha:new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}),
        };
        setLastOrder(order);
        // Persistir pedido para el panel de administración
        try {
          const prev=JSON.parse(localStorage.getItem('turbohogar_orders')||'[]');
          localStorage.setItem('turbohogar_orders', JSON.stringify([order,...prev].slice(0,50)));
        } catch(err){}
        clearCart();
        setPayOpen(false);
        navigate('confirm');
      },1100);
    },1900);
  };

  return <div className="page wrap mob-cta-pad" style={{paddingTop:96,paddingBottom:70,minHeight:'70vh'}}>
    <Breadcrumbs items={[{label:'Inicio',to:'home'},{label:'Carrito',to:'cart'},{label:'Checkout'}]}/>
    <div className="flex ic g2" style={{maxWidth:520,marginBottom:34}}>
      <span className="step on"><span className="num">1</span>Envío</span><span className="step-line act"/>
      <span className="step"><span className="num">2</span>Pago</span><span className="step-line"/>
      <span className="step"><span className="num">3</span>Listo</span>
    </div>
    {/* Resumen compacto — visible solo en mobile antes del formulario */}
    <div className="mob-order-strip">
      <div className="flex ic jb">
        <span className="small muted">{cartItems.length} {cartItems.length===1?'artículo':'artículos'} · {SHIP.find(s=>s.id===ship)?.n||'Starken'}</span>
        <span style={{fontWeight:800,fontSize:16}}>{CLP(total)}</span>
      </div>
    </div>
    <div className="cart-layout">
      <div className="flex col" style={{gap:28}}>
        <div className="card" style={{padding:24}}>
          <h3 className="h3" style={{marginBottom:18}}>Contacto</h3>
          <div className="form-grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {F({label:"Email",ph:"tu@email.com",type:"email",span:true,k:"email",req:true,mode:"email",ac:"email"})}
            {F({label:"RUT",ph:"12.345.678-5",span:true,k:"rut",req:true,ac:"off"})}
          </div>
        </div>
        <div className="card" style={{padding:24}}>
          <h3 className="h3" style={{marginBottom:18}}>Dirección de envío</h3>
          <div className="form-grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {F({label:"Nombre",ph:"Nombre",k:"nombre",req:true,ac:"given-name"})}
            {F({label:"Apellido",ph:"Apellido",k:"apellido",req:true,ac:"family-name"})}
            {F({label:"Dirección",ph:"Calle y número",span:true,k:"dir",req:true,ac:"street-address"})}
            {F({label:"Departamento / casa (opcional)",ph:"Depto 402",span:true,k:"depto",ac:"address-line2"})}
            {F({label:"Ciudad",ph:"Ciudad",k:"ciudad",req:true,ac:"address-level2"})}
            <div>
              <label className="field-label">Región</label>
              <Dropdown value={region} options={REGIONS} onChange={v=>{setRegion(v);setErrors(e=>({...e,region:undefined}));}} placeholder="Selecciona región" width={'100%'}/>
              {errors.region && <p className="cap" style={{color:'var(--error)',marginTop:4}}>{errors.region}</p>}
            </div>
            {F({label:"Código postal",ph:"7500000",k:"cp",mode:"numeric",ac:"postal-code"})}
            {F({label:"Teléfono",ph:"+56 9 1234 5678",type:"tel",k:"tel",req:true,mode:"tel",ac:"tel"})}
          </div>
        </div>
        <div className="card" style={{padding:24}}>
          <h3 className="h3" style={{marginBottom:18}}>Método de envío</h3>
          <div className="flex col g3">
            {SHIP.map(s=>(
              <div key={s.id} className={"radio-card"+(ship===s.id?' on':'')} onClick={()=>setShip(s.id)}>
                <span className="radio-dot"/>
                <div className="fx"><p style={{fontWeight:600}}>{s.n}</p><p className="cap muted">{s.d}</p></div>
                <span style={{fontWeight:700}}>{s.p?CLP(s.p):'Gratis'}</span>
              </div>
            ))}
          </div>
        </div>
        <button className="btn btn-primary btn-block btn-xl" onClick={goToPay}>Continuar al pago<Icon n="arrowR" s={18}/></button>
      </div>
      <CheckoutSummary ship={ship}/>
    </div>

    {payOpen && <PaymentModal
      stage={payStage} total={total} card={card} setC={setC} cardErr={cardErr}
      onClose={()=>setPayOpen(false)} onPay={submitPayment}/>}
    {/* Barra CTA fija — solo visible en mobile (≤900px) */}
    <div className="mob-cta-bar">
      <div style={{flex:1,minWidth:0}}>
        <p className="cap muted" style={{marginBottom:2}}>Total</p>
        <p style={{fontWeight:800,fontSize:17,letterSpacing:'-.01em'}}>{CLP(total)}</p>
      </div>
      <button className="btn btn-primary" style={{flex:'none'}} onClick={goToPay}>
        Ir a pagar<Icon n="shield" s={16}/>
      </button>
    </div>
  </div>;
}

  return <>
    <div className="overlay" style={{zIndex:200}} onClick={stage==='form'?onClose:undefined}/>

                onChange={e=>setC('num',fmtNum(e.target.value))} style={cardErr.num?{borderColor:'var(--error)'}:{}}/>

                {cardErr.exp && <p className="cap" style={{color:'var(--error)',marginTop:4}}>{cardErr.exp}</p>}
              </div>

                {cardErr.cvv && <p className="cap" style={{color:'var(--error)',marginTop:4}}>{cardErr.cvv}</p>}
              </div>
            </div>
          </div>
          <button className="btn btn-primary btn-block btn-xl" style={{marginTop:22}} onClick={onPay}>
            <Icon n="shield" s={17}/>Pagar {CLP(total)}</button>
          <p className="cap muted tc" style={{marginTop:12}}>No almacenamos los datos de tu tarjeta.</p>
        </>}
        {stage==='processing' && <div className="tc" style={{padding:'30px 10px'}}>
          <span className="spin" style={{display:'block',width:46,height:46,margin:'0 auto 22px'}}/>
          <p style={{fontWeight:800,fontSize:17,marginBottom:6}}>Procesando pago…</p>

          <p className="cap muted">Generando tu comprobante…</p>
        </div>}
      </div>
    </div>
  </>;
}

function FloatingCTA(){
  const {navigate,view} = useStore();
  const [show,setShow] = useState(false);
  useEffect(()=>{
    if(view!=='home'){setShow(false);return;}
    const fn = ()=>setShow(window.scrollY > window.innerHeight*0.65);
    window.addEventListener('scroll',fn,{passive:true});
    fn();
    return ()=>window.removeEventListener('scroll',fn);
  },[view]);
  if(!show || view!=='home') return null;
  return <button className="float-cta" onClick={()=>navigate('gallery')}>
    <Icon n="palette" s={16}/>Ver todos los diseños
  </button>;
}

/* ============================================================
   🆕 SVG CHARTS  (sin dependencias)
============================================================ */
function Sparkline({data,color='var(--accent)',w=88,h=30}){
  const max=Math.max(...data),min=Math.min(...data),rng=max-min||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-((v-min)/rng)*(h-4)-2]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return <svg width={w} height={h} style={{display:'block'}}>
    <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>;
}
function LineChartSVG({data,labels,height=240}){
  const [hi,setHi]=useState(null);
  const W=720,H=height,padL=44,padB=28,padT=14,padR=12;
  const max=Math.max(...data)*1.12, min=0, rng=max-min||1;
  const iw=W-padL-padR, ih=H-padT-padB;
  const X=i=>padL+(i/(data.length-1))*iw;
  const Y=v=>padT+ih-((v-min)/rng)*ih;
  const line=data.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L ${X(data.length-1)} ${padT+ih} L ${X(0)} ${padT+ih} Z`;
  const ticks=4; const gy=Array.from({length:ticks+1},(_,i)=>min+(rng)*(i/ticks));
  return <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}} preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1B2A4A" stopOpacity=".18"/><stop offset="100%" stopColor="#1B2A4A" stopOpacity="0"/></linearGradient></defs>
    {gy.map((g,i)=>(<g key={i}>
      <line x1={padL} x2={W-padR} y1={Y(g)} y2={Y(g)} stroke="#E5E7EB" strokeWidth="1"/>
      <text x={padL-8} y={Y(g)+4} fill="#8B92A0" fontSize="11" textAnchor="end">{'$'+Math.round(g/1000)+'k'}</text>
    </g>))}
    <path d={area} fill="url(#lcg)"/>
    <path d={line} fill="none" stroke="#1B2A4A" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
    {data.map((v,i)=> (i%Math.ceil(data.length/8)===0||i===data.length-1)?
      <circle key={i} cx={X(i)} cy={Y(v)} r={hi===i?5:3} fill="#fff" stroke="#1B2A4A" strokeWidth="2"
        onMouseEnter={()=>setHi(i)} onMouseLeave={()=>setHi(null)} style={{cursor:'default'}}/>
    :null)}
    {hi!==null && data[hi]!==undefined && (() => {
      const tx=X(hi), ty=Y(data[hi]), tw=96, th=28, tx2=Math.min(tx,W-padR-tw), ty2=Math.max(ty-38,padT);
      return <g pointerEvents="none">
        <rect x={tx2} y={ty2} width={tw} height={th} rx="5" fill="#1B2A4A" opacity=".92"/>
        <text x={tx2+tw/2} y={ty2+18} fill="#fff" fontSize="12" textAnchor="middle" fontWeight="600">
          {'$'+(data[hi]/1000).toFixed(0)+'k'}
        </text>
      </g>;
    })()}
    {labels&&labels.map((l,i)=> (i%Math.ceil(labels.length/6)===0)?<text key={i} x={X(i)} y={H-8} fill="#8B92A0" fontSize="11" textAnchor="middle">{l}</text>:null)}
  </svg>;
}
function BarChartSVG({data,labels,colors,height=240}){
  const W=720,H=height,padL=44,padB=28,padT=14,padR=12;
  const max=Math.max(...data)*1.12||1; const iw=W-padL-padR, ih=H-padT-padB;
  const bw=iw/data.length*0.55, gap=iw/data.length;
  const Y=v=>padT+ih-(v/max)*ih;
  const ticks=4; const gy=Array.from({length:ticks+1},(_,i)=>max*(i/ticks));
  return <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}} preserveAspectRatio="xMidYMid meet">
    {gy.map((g,i)=>(<g key={i}><line x1={padL} x2={W-padR} y1={Y(g)} y2={Y(g)} stroke="#E5E7EB" strokeWidth="1"/>
      <text x={padL-8} y={Y(g)+4} fill="#8B92A0" fontSize="11" textAnchor="end">{Math.round(g)}</text></g>))}
    {data.map((v,i)=>{ const x=padL+gap*i+(gap-bw)/2; const y=Y(v);
      return <g key={i}>
        <rect x={x} y={y} width={bw} height={padT+ih-y} rx="5" fill={(colors&&colors[i])||'#1B2A4A'} opacity=".88"/>
        {labels&&<text x={x+bw/2} y={H-8} fill="#8B92A0" fontSize="11" textAnchor="middle">{labels[i]}</text>}
      </g>;
    })}
  </svg>;
}
function DonutSVG({data,size=180,thickness=26}){
  const total=data.reduce((s,d)=>s+d.v,0)||1; const r=(size-thickness)/2; const C=2*Math.PI*r; let acc=0;
  return <div className="flex ic g4 fwrap">
    <svg width={size} height={size} style={{flex:'none'}}>
      <g transform={`translate(${size/2},${size/2}) rotate(-90)`}>
        <circle r={r} fill="none" stroke="#EEF0F2" strokeWidth={thickness}/>
        {data.map((d,i)=>{ const len=d.v/total*C; const el=<circle key={i} r={r} fill="none" stroke={d.c} strokeWidth={thickness}
          strokeDasharray={`${len} ${C-len}`} strokeDashoffset={-acc} strokeLinecap="butt"/>; acc+=len; return el; })}
      </g>
      <text x={size/2} y={size/2-4} fill="#111111" fontSize="22" fontWeight="800" textAnchor="middle">{total}</text>
      <text x={size/2} y={size/2+16} fill="#8B92A0" fontSize="11" textAnchor="middle">total</text>
    </svg>
    <div className="flex col g3">
      {data.map((d,i)=>(<div key={i} className="flex ic g2 small">
        <span style={{width:10,height:10,borderRadius:3,background:d.c,flex:'none'}}/>
        <span style={{fontWeight:600,color:'#4A5568'}}>{d.n}</span><span style={{color:'#8B92A0'}}>· {Math.round(d.v/total*100)}%</span></div>))}
    </div>
  </div>;
}
